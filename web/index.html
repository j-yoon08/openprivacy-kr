<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openprivacy-kr</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<div class="shell" id="shell">
  <div class="backdrop" id="backdrop" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="화면 탐색">
    <div class="sidebar-head">
      <div class="brand-block">
        <strong class="brand">openprivacy-kr</strong>
        <span class="workspace-name muted small" id="org-label"></span>
      </div>
      <button type="button" class="icon-btn mobile-only" id="menu-close" aria-label="메뉴 닫기">닫기</button>
    </div>
    <nav id="nav" aria-label="주요 화면"></nav>
    <div class="sidebar-foot small muted" id="sidebar-foot"></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button type="button" class="menu-btn mobile-only" id="menu-open" aria-expanded="false" aria-controls="sidebar">메뉴</button>
      <div class="topbar-crumb" id="crumb" aria-label="현재 위치">
        <span class="brand-inline mobile-only">openprivacy-kr</span>
        <span class="crumb-text" id="crumb-text">불러오는 중</span>
      </div>
      <div class="topbar-status">
        <span id="saved" role="status" aria-live="polite"></span>
      </div>
    </header>
    <div id="alert-bar" class="alert-bar" role="alert" aria-live="assertive" hidden></div>
    <main id="main" tabindex="-1"><p class="muted">불러오는 중…</p></main>
  </div>
</div>
</body>
</html>
