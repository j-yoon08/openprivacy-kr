# 여러 곳에서 쓰는 조건. all/any/not과 fact 비교로만 표현합니다.
sensitiveScale: # 시행령 제15조의2①, 제15조의3①
  any:
    # 민감정보·고유식별정보(주민등록번호 포함)를 처리하지 않으면 그 수를 묻지 않습니다
    - all:
        - any: [{ fact: sensitive, is: true }, { fact: uniqueId, is: true }, { fact: rrn, is: true }]
        - { fact: sensitiveSubjects, gte: 50000 }
    - { fact: subjects, gte: 1000000 }
largeHolder: # 안전성 확보조치 기준 제7조⑥, 제11조
  any:
    - all:
        - { fact: subjects, gte: 100000 }
        - any: [{ fact: sizeClass, in: [large, midcap] }, { fact: orgType, in: [public] }]
    - all:
        - { fact: subjects, gte: 1000000 }
        - any: [{ fact: sizeClass, in: [micro, small, medium] }, { fact: orgType, in: [nonprofit] }]
internalPlanExempt: # 안전성 확보조치 기준 제4조① 단서
  all:
    - { fact: subjects, lt: 10000 }
    - any: [{ fact: sizeClass, in: [micro] }, { fact: orgType, in: [nonprofit] }]
internalPlanRequired: { not: { ref: internalPlanExempt } }
logTwoYears: # 안전성 확보조치 기준 제8조① 단서
  any:
    - { fact: subjects, gte: 50000 }
    - { fact: uniqueId, is: true }
    - { fact: sensitive, is: true }
    - { fact: carrier, is: true }
netSeparation: { fact: storedUsers, gte: 1000000 } # 안전성 확보조치 기준 제6조의2①
ismsMandatory: # 정보통신망법 제47조②, 시행령 제49조②
  all:
    - { fact: onlineService, is: true }
    - any:
        - { fact: majorIsp, is: true }
        - { fact: idc, is: true }
        - all:
            - { fact: revenue, gte: 1500 }
            - any:
                - { fact: tertiaryHospital, is: true }
                - all: [{ fact: university, is: true }, { fact: students, gte: 10000 }]
        - all:
            - { fact: financial, is: false }
            - any: [{ fact: itRevenue, gte: 100 }, { fact: dailyUsers, gte: 1000000 }]
cpoReport: # 시행령 제32조③
  any:
    - all:
        - { fact: revenue, gt: 1800 }
        - { fact: school, is: false }
        - { fact: hospital, is: false }
        - { ref: sensitiveScale }
    - all: [{ fact: university, is: true }, { fact: students, gte: 20000 }]
    - { fact: tertiaryHospital, is: true }
    - { fact: publicSystem, is: true }
ismspDraft: # 시행령 일부개정령안(2026-06-02 입법예고) ISMS-P 인증 의무 대상. 확정 전
  any:
    - all: [{ fact: publicSystem, is: true }, { fact: ismspDesignated, is: true }]
    - all: [{ fact: carrier, is: true }, { fact: mobileCarrier, is: true }]
    - { fact: identityProvider, is: true }
    - all:
        - { fact: revenue, gte: 10000 }
        - { fact: itRevenue, gte: 100 }
        - { fact: domesticSubjects, gte: 30000000 }
insurance: # 시행령 제48조의7①
  all:
    - { fact: revenue, gte: 10 }
    # 임직원을 뺀 수는 전체 수보다 클 수 없으므로, 전체가 1만명 미만이면 따로 묻지 않습니다
    - { fact: subjects, gte: 10000 }
    - { fact: externalSubjects, gte: 10000 }
uniqueOrSensitive: { any: [{ fact: uniqueId, is: true }, { fact: sensitive, is: true }] }
encryptTarget: { any: [{ fact: uniqueId, is: true }, { fact: cardAccount, is: true }, { fact: biometric, is: true }] }
isPublic: { fact: orgType, in: [public] }
externalParties: { any: [{ fact: contractors, is: true }, { fact: outsourcing, is: true }] }
domesticAgent: # 법 제31조의2①, 시행령 제32조의3①
  all:
    - { fact: foreignOnly, is: true }
    - any:
        - { fact: revenue, gte: 10000 }
        - { fact: domesticSubjects, gte: 1000000 }
        - { fact: agentOrdered, is: true }
portabilityNow: # 시행령 제42조의2①2·3, ②
  any:
    - { fact: publicSystem, is: true }
    - { fact: dataSender, is: true }
portabilitySoon: # 시행령 제42조의2①1 (2027-02-20 시행)
  all:
    - { fact: revenue, gt: 1800 }
    - { fact: school, is: false }
    - { fact: hospital, is: false }
    - { ref: sensitiveScale }
portability: { any: [{ ref: portabilityNow }, { ref: portabilitySoon }] }
