# 조직 상황으로 판정하는 법적 의무. when이 참이면 해당, 거짓이면 비해당, 값이 없어 모르면 확인 필요.
# verifyWhen이 참이면 해당 여부를 자동으로 단정하지 않고 사유와 함께 확인 필요로 둡니다.
- id: isms
  title: ISMS 인증 의무
  when: { ref: ismsMandatory }
  basis: 정보통신망법 제47조②, 같은 법 시행령 제49조②
  required: 의무대상 기준에 해당합니다. 인증 신청 전 관리체계를 구축해 최소 2개월 이상 운영해야 합니다(인증 고시 제17조①).
  otherwise: 입력한 값으로는 의무대상이 아닙니다. 자율 인증은 가능합니다.
- id: ismsp
  title: ISMS-P 인증 의무(2027-07-01 시행)
  when: { always: false }
  verifyWhen: { always: true }
  verify: 제도는 2027-07-01 시행되지만 확인일 현재 현행 시행령에서 의무대상 기준을 확인하지 못했습니다. 시행령·고시 개정을 확인하세요.
  basis: 개인정보 보호법 제32조의2① 단서, 법률 제21445호 부칙 제1조
  required: 의무대상입니다.
  otherwise: 의무대상이 아닙니다.
- id: cpo
  title: 개인정보 보호책임자(CPO) 지정
  when: { not: { fact: sizeClass, in: [micro] } }
  basis: 개인정보 보호법 제31조①·②, 시행령 제32조①·②
  required: CPO를 지정해야 합니다. 민간은 사업주·대표자 또는 임원(임원이 없으면 담당 부서장) 중에서 지정합니다.
  otherwise: 소상공인은 지정하지 않을 수 있고, 이 경우 사업주·대표자가 CPO가 됩니다.
- id: cpo-report
  title: CPO 지정·변경·해제 이사회 의결과 신고
  when: { ref: cpoReport }
  basis: 개인정보 보호법 제31조③, 시행령 제32조③·④
  required: 이사회 의결(법인)을 거치고 사유 발생일부터 6개월 이내에 보호위원회에 신고해야 합니다. CPO는 시행령 별표 1의 자격도 갖춰야 합니다.
  otherwise: 입력한 값으로는 대상이 아닙니다.
- id: ceo
  title: 대표자의 총괄 관리 책임
  when: { always: true }
  basis: 개인정보 보호법 제30조의3
  required: 사업주·대표자는 최종 책임자로서 전문 인력과 충분한 예산 지원 등 총괄 관리 조치를 해야 합니다.
  otherwise: ""
- id: ciso
  title: 정보보호 최고책임자(CISO) 신고
  when: { all: [{ fact: onlineService, is: true }, { fact: sizeClass, in: [midcap, large] }] }
  verifyWhen: { all: [{ fact: onlineService, is: true }, { fact: sizeClass, in: [micro, small, medium, none] }] }
  verify: 자본금 1억원 이하·소기업·일부 중기업은 신고를 하지 않을 수 있지만 예외가 있습니다. 시행령 제36조의7 각 호를 확인하세요.
  basis: 정보통신망법 제45조의3①, 시행령 제36조의7
  required: 자격을 갖춘 임원급을 CISO로 지정하고 신고해야 합니다. 자산 규모에 따라 겸직이 제한됩니다.
  otherwise: 정보통신서비스 제공자가 아니면 대상이 아닙니다.
- id: internal-plan
  title: 내부 관리계획 수립·시행
  when: { ref: internalPlanRequired }
  basis: 안전성 확보조치 기준 제4조①
  required: 18개 사항을 담은 내부 관리계획을 수립·시행하고, 이행 실태를 연 1회 이상 점검해야 합니다.
  otherwise: 1만명 미만을 처리하는 소상공인·개인·단체는 생략할 수 있습니다.
- id: log-2y
  title: 접속기록 2년 이상 보관
  when: { ref: logTwoYears }
  basis: 안전성 확보조치 기준 제8조①
  required: 해당 개인정보처리시스템의 접속기록을 2년 이상 보관해야 합니다(5만명 이상·고유식별·민감정보 요건은 시스템별로 판단).
  otherwise: 1년 이상 보관하면 됩니다.
- id: net-separation
  title: 개인정보취급자 컴퓨터 인터넷망 차단
  when: { ref: netSeparation }
  basis: 안전성 확보조치 기준 제6조의2, 시행령 제30조①3나
  required: 권한 설정·다운로드·파기가 가능한 취급자의 컴퓨터를 인터넷망에서 차단해야 합니다. 다운로드·파기 취급자는 위험 분석에 따른 예외가 있습니다.
  otherwise: 이용자 일일평균 100만명 미만이면 대상이 아닙니다.
- id: key-dr
  title: 암호키 관리 절차와 재해·재난 대비
  when: { ref: largeHolder }
  basis: 안전성 확보조치 기준 제7조⑥, 제11조
  required: 암호키 생성~파기 절차, 위기대응 매뉴얼과 백업·복구 계획을 마련해야 합니다.
  otherwise: 법정 의무 기준에는 미치지 않습니다. 인증 기준상 필요할 수 있습니다.
- id: usage-notice
  title: 이용·제공 내역 연 1회 이상 통지
  when: { ref: sensitiveScale }
  basis: 개인정보 보호법 제20조의2, 시행령 제15조의3
  required: 이용·제공 내역이나 확인 방법을 연 1회 이상 정보주체에게 알려야 합니다.
  otherwise: 입력한 규모로는 대상이 아닙니다.
- id: source-notice
  title: 간접수집 출처 통지(3개월 이내)
  when: { all: [{ fact: indirect, is: true }, { ref: sensitiveScale }] }
  basis: 개인정보 보호법 제20조②, 시행령 제15조의2
  required: 제공받은 날부터 3개월 이내에 수집 출처 등을 알려야 합니다(법 제17조①1 동의에 따라 제공받은 경우).
  otherwise: 선제적 통지 대상은 아닙니다. 정보주체가 요구하면 즉시 알려야 합니다(제20조①).
- id: insurance
  title: 손해배상 보험·공제·준비금
  when: { ref: insurance }
  verifyWhen: { all: [{ ref: insurance }, { fact: orgType, in: [public, nonprofit] }] }
  verify: 규모 요건에는 해당하지만 공공기관·공익법인 등은 제외될 수 있습니다. 시행령 제48조의7②를 확인하세요.
  basis: 개인정보 보호법 제39조의7, 시행령 제48조의7
  required: 매출 10억원 이상이면서 정보주체 1만명 이상이므로 보험·공제 가입 또는 준비금 적립이 필요합니다.
  otherwise: 입력한 규모로는 대상이 아닙니다.
- id: pia
  title: 개인정보 영향평가(공공기관)
  when: { all: [{ ref: isPublic }, { ref: sensitiveScale }] }
  verifyWhen: { all: [{ ref: isPublic }, { not: { ref: sensitiveScale } }] }
  verify: 다른 파일과 연계해 50만명 이상이 되거나 평가 후 운용체계를 바꾸면 대상이 됩니다. 파일별로 확인하세요.
  basis: 개인정보 보호법 제33조①, 시행령 제35조
  required: 개인정보파일 구축·변경 시 영향평가를 해야 합니다.
  otherwise: 공공기관이 아니면 의무가 아닙니다.
- id: breach
  title: 유출 통지·신고 72시간
  when: { always: true }
  basis: 개인정보 보호법 제34조, 시행령 제39조~제40조
  required: 유출을 알면 72시간 이내에 정보주체에게 알리고, 1천명 이상·민감/고유식별정보·외부 불법접근이면 72시간 이내에 신고해야 합니다. 2026-09-11부터는 시행령이 정한 '유출 가능성'을 안 때에도 72시간 이내에 통지해야 합니다.
  otherwise: ""
- id: incident-24h
  title: 침해사고 24시간 이내 신고
  when: { fact: onlineService, is: true }
  basis: 정보통신망법 제48조의3①
  required: 정보통신서비스 제공자는 침해사고를 안 때부터 24시간 이내에 과기정통부 장관 또는 KISA에 신고해야 합니다.
  otherwise: 정보통신서비스 제공자가 아니면 대상이 아닙니다.
- id: public-pentest
  title: 공공시스템 연 1회 취약점 점검·침투테스트(2027-01-01 시행)
  when: { fact: publicSystem, is: true }
  basis: 안전성 확보조치 기준 제18조
  required: 공공시스템별로 연 1회 이상 취약점 점검과 외부 전문가 침투테스트를 해야 합니다.
  otherwise: 지정된 공공시스템 운영기관이 아니면 대상이 아닙니다.
