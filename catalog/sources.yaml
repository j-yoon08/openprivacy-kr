watch:
  - title: "ISMS·ISMS-P 인증제 개편"
    detail: "정부가 2026-04-10 강화·표준·간편 3단계 개편과 예비·기술·현장실증 심사 도입을 발표했습니다. 이 카탈로그는 확인일 현재 시행 중인 고시(제2024-8호·제2024-30호)의 101개 항목을 씁니다. 개정 고시가 나오면 갱신이 필요합니다."
    url: "https://byline.network/2026/04/10-634/"
  - title: "ISMS-P 인증 의무화"
    detail: "개인정보 보호법 제32조의2제1항 단서가 2027-07-01 시행됩니다(법률 제21445호 부칙 제1조). 의무대상을 정하는 시행령 개정안이 2026-06-02~07-13 입법예고됐습니다(공공시스템운영기관 중 고시 대상, 이동통신사업자, 본인확인기관, 전년도 매출 1조원 이상·정보통신서비스 매출 100억원 이상·국내 정보주체 일평균 3천만명 이상, 2028-12-31까지 인증). 같은 안에는 CPO 지정·변경·해제 신고 기한을 1개월로 바꾸는 내용도 있으나, 2026-11-10 시행 시행령은 아직 6개월입니다. 확정되면 갱신이 필요합니다."
    url: "https://www.moleg.go.kr/lawinfo/makingInfo.mo?lawSeq=86980&lawCd=0&lawType=TYPE5&mid=a10104010000"
  - title: "인공지능기술 개발 특례(법률 제21910호)"
    detail: "2026-09-08 공포. 부칙의 '공포 후 6개월이 경과한 날'을 계산하면 2027-03-09 시행입니다. 제28조의12~제28조의15 신설 등 예정 조문을 법령 전문에 함께 실었습니다."
    url: "https://www.law.go.kr/법령/개인정보보호법"
  - title: "전송요구권 대상 확대"
    detail: "시행령 제42조의2제1항제1호(매출 1,800억원 초과 등)가 2027-02-20 시행됩니다."
    url: "https://www.law.go.kr/법령/개인정보보호법시행령"
  - title: "공공시스템 취약점 점검·침투테스트"
    detail: "안전성 확보조치 기준 제15조제5호와 제18조가 2027-01-01 시행됩니다."
    url: "https://www.law.go.kr/행정규칙/개인정보의안전성확보조치기준"
