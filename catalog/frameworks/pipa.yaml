id: pipa
title: 개인정보 보호법·안전성 확보조치 기준
source: pipa-law
note: 점검으로 확인하는 의무 조문입니다. 나머지 조문을 포함한 전문은 catalog/law에 있고 상황 검토에서 모두 다룹니다. 법 조문은 "제N조", 안전성 확보조치 기준은 "기준 제N조"로 적습니다.
requirements:
  - id: "제3조"
    title: "개인정보 보호 원칙"
    group: "개인정보 보호법"
    points:
      - { text: "① 처리 목적을 명확히 하고 목적에 필요한 최소한의 개인정보만 적법·정당하게 수집", checks: [prv-inventory, gov-flow, prv-minimum] }
      - { text: "② 목적 범위에서 적합하게 처리하고 목적 외 용도로 활용 금지", checks: [prv-purpose] }
      - { text: "③ 목적 범위에서 정확성·완전성·최신성 보장", checks: [prv-quality] }
      - { text: "④ 권리 침해 가능성과 위험 정도를 고려해 안전하게 관리", checks: [gov-risk-method] }
      - { text: "⑤ 처리방침 등 처리 사항 공개와 열람청구권 등 정보주체 권리 보장", checks: [prv-policy, prv-rights] }
      - { text: "⑥ 사생활 침해를 최소화하는 방법으로 처리", checks: [prv-privacy-min, dev-req] }
      - { text: "⑦ 익명·가명으로 목적을 달성할 수 있으면 익명 우선, 불가하면 가명 처리", checks: [prv-anonymize] }
      - { text: "⑧ 법령상 책임과 의무를 준수·실천", checks: [gov-legal] }
  - id: "제11조의2"
    title: "개인정보 보호수준 평가"
    group: "개인정보 보호법"
    points:
      - { text: "② 보호위원회가 요구한 평가 자료 제출", checks: [gov-level-eval] }
      - { text: "④ 개선 권고를 성실히 이행하고 조치 결과를 보호위원회에 통보", checks: [gov-level-eval-fix] }
  - id: "제15조"
    title: "개인정보의 수집ㆍ이용"
    group: "개인정보 보호법"
    points:
      - { text: "① 동의·법령·계약 등 법정 근거가 있을 때만 수집하고 수집 목적 범위에서 이용", checks: [prv-basis] }
      - { text: "② 동의 시 목적·항목·보유기간·거부권과 불이익을 알리고, 변경 시 다시 알리고 동의", checks: [prv-consent-notice] }
      - { text: "③ 동의 없는 추가적 이용은 시행령 제14조의2 고려사항을 판단한 경우로 한정(지속 시 기준 공개·CPO 점검)", checks: [prv-additional-use] }
  - id: "제16조"
    title: "개인정보의 수집 제한"
    group: "개인정보 보호법"
    points:
      - { text: "① 목적에 필요한 최소한만 수집(입증책임은 처리자)", checks: [prv-minimum, prv-indirect-min] }
      - { text: "② 동의로 수집 시 최소한 외 정보는 동의하지 않을 수 있음을 구체적으로 알림", checks: [prv-optional-notice] }
      - { text: "③ 최소한 외 정보 수집에 동의하지 않는다는 이유로 재화·서비스 제공 거부 금지", checks: [prv-minimum] }
  - id: "제17조"
    title: "개인정보의 제공"
    group: "개인정보 보호법"
    points:
      - { text: "① 동의 또는 법정 수집 목적 범위에서만 제3자 제공", checks: [prv-third] }
      - { text: "② 제공 동의 시 받는 자·목적·항목·보유기간·거부권과 불이익을 알리고, 변경 시 다시 동의", checks: [prv-third-notice] }
      - { text: "④ 동의 없는 추가적 제공은 시행령 제14조의2 고려사항을 판단한 경우로 한정", checks: [prv-additional-use] }
  - id: "제18조"
    title: "개인정보의 목적 외 이용ㆍ제공 제한"
    group: "개인정보 보호법"
    points:
      - { text: "①② 목적 외 이용·제3자 제공은 별도 동의·다른 법률 등 법정 예외로 한정", checks: [prv-purpose] }
      - { text: "③ 별도 동의 시 받는 자·목적·항목·보유기간·거부권과 불이익을 알리고, 변경 시 다시 동의", checks: [prv-purpose-notice] }
      - { text: "④ 공공기관은 목적 외 이용·제공의 근거·목적·범위를 관보·홈페이지에 게재하고 대장에 기록", checks: [prv-purpose-public] }
      - { text: "⑤ 목적 외 제공 시 받는 자에게 이용 제한이나 안전조치 마련을 요청", checks: [prv-purpose-protect] }
  - id: "제19조"
    title: "개인정보를 제공받은 자의 이용ㆍ제공 제한"
    group: "개인정보 보호법"
    points:
      - { text: "제공받은 목적 외 이용·제3자 제공은 별도 동의나 다른 법률 근거가 있을 때만", checks: [prv-received] }
  - id: "제20조"
    title: "정보주체 이외로부터 수집한 개인정보의 수집 출처 등 통지"
    group: "개인정보 보호법"
    points:
      - { text: "① 정보주체 요구 시 수집 출처·처리 목적·처리정지 요구권 등을 즉시 알림", checks: [prv-indirect] }
      - { text: "② 대상 규모 처리자는 제공받은 날부터 3개월 이내에 출처 등을 통지", checks: [prv-indirect-days] }
      - { text: "영 제15조의2④ 통지 사실·시기·방법을 파기할 때까지 보관", checks: [prv-indirect-record] }
  - id: "제20조의2"
    title: "개인정보 이용ㆍ제공 내역의 통지"
    group: "개인정보 보호법"
    points:
      - { text: "① 이용·제공 내역이나 확인 시스템 접속 방법을 연 1회 이상 통지", checks: [prv-notice] }
      - { text: "② 시행령 제15조의3의 대상·내용·방법에 맞춰 통지", checks: [prv-notice-content] }
  - id: "제21조"
    title: "개인정보의 파기"
    group: "개인정보 보호법"
    points:
      - { text: "① 보유기간 경과·목적 달성 등으로 불필요해지면 지체 없이 파기", checks: [prv-destroy] }
      - { text: "② 복구·재생되지 않도록 파기", checks: [prv-destroy, ops-dispose] }
      - { text: "③ 법령에 따라 보존하는 개인정보는 다른 개인정보와 분리해 저장·관리", checks: [prv-retain] }
  - id: "제22조"
    title: "동의를 받는 방법"
    group: "개인정보 보호법"
    points:
      - { text: "① 동의 사항을 구분해 명확히 알리고 각 호의 동의를 각각 받음", checks: [prv-consent] }
      - { text: "①7 홍보·판매 권유 목적의 동의를 구분해 받음", checks: [prv-marketing, prv-marketing-notice] }
      - { text: "② 서면 동의 시 시행령 제17조③의 중요한 내용을 명확히 표시", checks: [prv-consent-highlight] }
      - { text: "③ 동의 없이 처리하는 항목과 법적 근거를 구분해 공개하거나 알림", checks: [prv-nonconsent-disclose] }
      - { text: "⑤ 선택 동의를 하지 않았다는 이유로 재화·서비스 제공 거부 금지", checks: [prv-minimum] }
      - { text: "⑦ 시행령 제17조의 동의 조건(자유 의사, 구체·명확, 쉬운 문구, 선택 가능 표시) 준수", checks: [prv-consent-free] }
  - id: "제22조의2"
    title: "아동의 개인정보 보호"
    group: "개인정보 보호법"
    points:
      - { text: "① 만 14세 미만 아동은 법정대리인 동의를 받고 동의 여부를 시행령 방법으로 확인", checks: [prv-children] }
      - { text: "② 법정대리인 동의 없이 아동에게서 직접 받는 정보는 법정대리인 성명·연락처로 한정", checks: [prv-children-min] }
      - { text: "③ 아동에게는 이해하기 쉬운 양식과 명확하고 알기 쉬운 언어로 고지", checks: [prv-children-notice] }
  - id: "제23조"
    title: "민감정보의 처리 제한"
    group: "개인정보 보호법"
    points:
      - { text: "① 민감정보는 별도 동의 또는 법령 근거가 있을 때만 처리", checks: [prv-sensitive, prv-sensitive-sep] }
      - { text: "② 민감정보의 유출등 방지를 위한 안전성 확보조치", checks: [prv-sensitive-secure] }
      - { text: "③ 공개되는 정보에 민감정보가 포함될 위험이 있으면 제공 전에 공개 가능성과 비공개 선택 방법을 알림", checks: [prv-sensitive-public] }
  - id: "제24조"
    title: "고유식별정보의 처리 제한"
    group: "개인정보 보호법"
    points:
      - { text: "① 고유식별정보는 별도 동의 또는 법령의 구체적 근거가 있을 때만 처리", checks: [prv-sensitive, prv-unique-sep] }
      - { text: "③ 고유식별정보의 암호화 등 안전성 확보조치", checks: [cry-store] }
  - id: "제24조의2"
    title: "주민등록번호 처리의 제한"
    group: "개인정보 보호법"
    points:
      - { text: "① 법령의 구체적 근거 등 허용된 경우에만 주민등록번호 처리", checks: [prv-rrn] }
      - { text: "② 주민등록번호를 암호화해 안전하게 보관", checks: [cry-store] }
      - { text: "③ 홈페이지 회원가입 단계에서 주민등록번호 없이 가입하는 방법 제공", checks: [prv-rrn-alt] }
  - id: "제25조"
    title: "고정형 영상정보처리기기의 설치ㆍ운영 제한"
    group: "개인정보 보호법"
    points:
      - { text: "① 공개된 장소에는 법정 목적에 해당할 때만 설치·운영", checks: [prv-cctv] }
      - { text: "② 목욕실·화장실·탈의실 등 내부를 볼 수 있게 설치·운영 금지", checks: [prv-cctv-private] }
      - { text: "③ 공공기관 등은 설치 전 행정예고·설명회 등으로 의견 수렴", checks: [prv-cctv-hearing] }
      - { text: "④ 설치 목적·장소, 촬영 범위·시간, 관리책임자 연락처를 담은 안내판 설치", checks: [prv-cctv-sign] }
      - { text: "⑤ 목적 외 임의 조작·다른 곳 촬영 금지, 녹음기능 사용 금지", checks: [prv-cctv-noaudio] }
      - { text: "⑥ 영상정보 유출등 방지를 위한 안전성 확보조치", checks: [prv-cctv-secure] }
      - { text: "⑦ 운영·관리 방침 마련(처리방침에 포함 가능)", checks: [prv-cctv-policy] }
      - { text: "⑧ 공공기관이 사무를 위탁하면 시행령 제26조의 문서·안내판 요건 준수", checks: [prv-cctv-outsource] }
  - id: "제25조의2"
    title: "이동형 영상정보처리기기의 운영 제한"
    group: "개인정보 보호법"
    points:
      - { text: "① 공개된 장소 촬영은 제15조① 근거나 촬영 사실 표시 후 거부가 없는 경우 등으로 한정", checks: [prv-mobilecam] }
      - { text: "② 목욕실·화장실·탈의실 등 내부를 볼 수 있는 곳에서 촬영 금지", checks: [prv-cctv-private] }
      - { text: "③ 불빛·소리·안내판 등으로 촬영 사실을 표시하고 알림", checks: [prv-mobilecam-sign] }
      - { text: "④ 안전성 확보조치와 운영·관리 방침 마련(제25조⑥⑦ 준용)", checks: [prv-cctv-secure, prv-cctv-policy] }
  - id: "제26조"
    title: "업무위탁에 따른 개인정보의 처리 제한"
    group: "개인정보 보호법"
    points:
      - { text: "① 법정 사항을 담은 문서로 위탁", checks: [sup-contract] }
      - { text: "② 위탁 업무 내용과 수탁자를 홈페이지 등에 지속 공개", checks: [prv-outsource-public] }
      - { text: "③ 홍보·판매 권유 업무 위탁 시 업무 내용과 수탁자를 서면등으로 통지(변경 시 포함)", checks: [prv-outsource-notify] }
      - { text: "④ 수탁자 교육과 처리 현황 점검 등 감독", checks: [sup-monitor] }
  - id: "제27조"
    title: "영업양도 등에 따른 개인정보의 이전 제한"
    group: "개인정보 보호법"
    points:
      - { text: "① 이전 전에 이전 사실·받는 자 연락처·거부 방법을 서면등으로 미리 통지", checks: [prv-transfer] }
      - { text: "② 영업양수자등은 이전받은 사실을 지체 없이 통지(양도자가 알린 경우 제외)", checks: [prv-transfer-receive] }
      - { text: "③ 영업양수자등은 이전 당시 본래 목적으로만 이용·제공", checks: [prv-transfer-purpose] }
  - id: "제28조"
    title: "개인정보취급자에 대한 감독"
    group: "개인정보 보호법"
    points:
      - { text: "① 개인정보취급자의 범위를 최소한으로 제한", checks: [ppl-key] }
      - { text: "① 개인정보취급자를 적절히 관리·감독", checks: [ppl-handler-supervise] }
      - { text: "② 개인정보취급자에게 정기적으로 필요한 교육", checks: [ppl-training] }
  - id: "제28조의2"
    title: "가명정보의 처리 등"
    group: "개인정보 보호법"
    points:
      - { text: "① 동의 없는 가명정보 처리는 통계작성·과학적 연구·공익적 기록보존 등 목적으로 한정", checks: [prv-pseudo-purpose] }
      - { text: "② 제3자 제공 시 특정 개인을 알아보는 데 쓰일 수 있는 정보 제외", checks: [prv-pseudo-provide] }
  - id: "제28조의3"
    title: "가명정보의 결합 제한"
    group: "개인정보 보호법"
    points:
      - { text: "① 다른 처리자와의 가명정보 결합은 지정 전문기관을 통해서만", checks: [prv-combine] }
      - { text: "② 결합정보 반출은 가명·익명 처리 후 전문기관 장의 승인을 받아서만", checks: [prv-combine-export] }
  - id: "제28조의4"
    title: "가명정보에 대한 안전조치의무 등"
    group: "개인정보 보호법"
    points:
      - { text: "① 추가정보 분리 보관 등 시행령 제29조의5의 안전성 확보조치", checks: [prv-pseudonym] }
      - { text: "① 가명정보와 추가정보 접근권한 분리, 불필요한 추가정보 파기", checks: [prv-pseudo-access] }
      - { text: "③ 처리 목적·항목·이용내역·제공받는 자 등 처리 기록 작성·보관", checks: [prv-pseudo-record] }
      - { text: "③ 가명정보 파기 후 처리 기록을 3년 이상 보관", checks: [prv-pseudo-record-years] }
  - id: "제28조의5"
    title: "가명정보 처리 시 금지의무 등"
    group: "개인정보 보호법"
    points:
      - { text: "① 특정 개인을 알아보기 위한 목적의 처리 금지", checks: [prv-pseudonym] }
      - { text: "② 특정 개인을 알아볼 수 있는 정보가 생성되면 즉시 처리 중지, 지체 없이 회수·파기", checks: [prv-pseudo-reid] }
  - id: "제28조의8"
    title: "개인정보의 국외 이전"
    group: "개인정보 보호법"
    points:
      - { text: "① 별도 동의·법률·계약 이행 위탁·보관·인증·동등성 인정 등 법정 근거가 있을 때만 국외 이전", checks: [prv-overseas] }
      - { text: "①3 계약 이행 위탁·보관은 이전 사항을 처리방침에 공개하거나 서면등으로 알림", checks: [prv-overseas-disclose] }
      - { text: "②③ 이전 동의 시 법정 5가지 사항을 미리 알리고, 변경 시 다시 알리고 동의", checks: [prv-overseas-consent] }
      - { text: "④⑤ 시행령 제29조의10 보호조치를 계약에 반영하고 법 위반 내용의 이전 계약 금지", checks: [prv-overseas-protect] }
  - id: "제29조"
    title: "안전조치의무"
    group: "개인정보 보호법"
    points:
      - { text: "영 제30조①1 내부 관리계획 수립·시행·점검", checks: [gov-internal-plan, gov-internal-plan-review] }
      - { text: "영 제30조①2 접근권한 부여·변경·말소 기준과 인증수단 적용", checks: [acc-lifecycle, acc-auth] }
      - { text: "영 제30조①3 침입 탐지·차단과 대상 취급자 컴퓨터의 인터넷망 차단", checks: [net-detect, net-separation] }
      - { text: "영 제30조①4 인증정보·고유식별정보 등의 암호화 저장과 송수신 암호화", checks: [cry-password, cry-store, cry-transit] }
      - { text: "영 제30조①5 접속기록 보관·점검과 위변조 방지", checks: [log-retention, log-review, log-protect] }
      - { text: "영 제30조①6 악성프로그램 방지 프로그램 설치·운영·갱신", checks: [ops-malware] }
      - { text: "영 제30조①7 보관시설·잠금장치 등 물리적 조치", checks: [phy-access, ops-media] }
  - id: "제30조"
    title: "개인정보 처리방침의 수립 및 공개"
    group: "개인정보 보호법"
    points:
      - { text: "① 법정 사항을 모두 담은 처리방침 수립", checks: [prv-policy] }
      - { text: "② 홈페이지 지속 게재 등 정보주체가 쉽게 확인할 수 있게 공개", checks: [prv-policy-easy] }
      - { text: "② 처리방침을 변경하면 지체 없이 고쳐 공개", checks: [prv-policy-update] }
  - id: "제30조의3"
    title: "사업주 또는 대표자의 책임"
    group: "개인정보 보호법"
    points:
      - { text: "개인정보 보호에 필요한 전문 인력과 충분한 예산 지원", checks: [gov-ceo, gov-staff] }
      - { text: "최종 책임자로서 보호 현황을 보고받아 총괄 관리 조치를 실효성 있게 수행", checks: [gov-ceo, gov-report] }
  - id: "제31조"
    title: "개인정보 보호책임자의 지정 등"
    group: "개인정보 보호법"
    points:
      - { text: "①② 개인정보 보호책임자 지정(소상공인은 대표자), 시행령 제32조②의 직급·자격 충족", checks: [gov-cpo] }
      - { text: "③1 대상자는 CPO 지정·변경·해제 시 이사회 의결", checks: [gov-cpo-report] }
      - { text: "③2 대상자는 사유 발생일부터 6개월 이내에 보호위원회에 신고", checks: [gov-cpo-report, gov-cpo-report-months] }
      - { text: "④ CPO가 보호 계획, 실태 조사·개선, 불만 처리, 내부통제, 교육 등 법정 업무 수행", checks: [gov-cpo-duties] }
      - { text: "⑥ CPO가 위반 사실을 알게 되면 즉시 개선조치하고 필요하면 보고", checks: [gov-cpo-violation] }
      - { text: "⑦ CPO에게 업무상 불이익 금지와 독립적 업무 수행 보장(시행령 제32조⑦)", checks: [gov-cpo-independence] }
  - id: "제31조의2"
    title: "국내대리인의 지정"
    group: "개인정보 보호법"
    points:
      - { text: "①② 국내 주소·영업소가 있는 자(국내 법인이 있으면 그 법인)를 문서로 국내대리인 지정", checks: [gov-domestic-agent] }
      - { text: "③ 국내대리인에게 연 1회 이상 교육하고 업무 계획 수립·이행을 점검", checks: [gov-domestic-agent-cycle] }
      - { text: "④ 국내대리인 성명·주소·연락처를 처리방침에 포함", checks: [gov-domestic-agent] }
  - id: "제32조"
    title: "개인정보파일의 등록 및 공개"
    group: "개인정보 보호법"
    points:
      - { text: "① 공공기관은 개인정보파일을 운용 시작 후 60일 이내에 등록하고 변경 시에도 등록", checks: [gov-file-register] }
  - id: "제33조"
    title: "개인정보 영향평가"
    group: "개인정보 보호법"
    points:
      - { text: "① 대상 개인정보파일의 영향평가를 하고 개선 사항 이행", checks: [gov-pia] }
      - { text: "①② 지정 평가기관에 의뢰하고 결과를 보호위원회에 제출", checks: [gov-pia-agency] }
      - { text: "⑤ 개인정보파일 등록 시 영향평가 결과 첨부", checks: [gov-pia-agency] }
  - id: "제34조"
    title: "개인정보 유출등의 통지ㆍ신고"
    group: "개인정보 보호법"
    points:
      - { text: "① 유출등을 알게 되면 72시간 이내에 법정 사항을 정보주체에게 통지", checks: [inc-notify, inc-notify-hours] }
      - { text: "② 유출등의 가능성을 알게 되면 72시간 이내에 가능성 통지", checks: [inc-possible] }
      - { text: "③ 피해 확산 방지와 피해 최소화 대책 마련·조치", checks: [inc-plan, inc-respond] }
      - { text: "④ 신고 대상 유출등은 72시간 이내에 보호위원회 또는 KISA에 신고", checks: [inc-notify, inc-report-hours] }
  - id: "제34조의2"
    title: "노출된 개인정보의 삭제ㆍ차단"
    group: "개인정보 보호법"
    points:
      - { text: "① 고유식별정보·계좌·카드정보 등이 정보통신망으로 공중에 노출되지 않게 함", checks: [exposure] }
      - { text: "② 보호위원회·전문기관 요청 시 노출된 개인정보 삭제·차단", checks: [exposure-request] }
  - id: "제35조"
    title: "개인정보의 열람"
    group: "개인정보 보호법"
    points:
      - { text: "③ 열람 요구를 받은 날부터 10일 이내에 열람하게 함(연기 시 사유 통지)", checks: [prv-rights-days] }
      - { text: "④ 열람 제한·거절 시 사유와 이의제기 방법 통지", checks: [prv-rights-refuse] }
      - { text: "⑤·영 제41조② 수집보다 어렵지 않은 열람 요구 방법을 마련·공개", checks: [prv-rights] }
  - id: "제35조의2"
    title: "개인정보의 전송 요구"
    group: "개인정보 보호법"
    points:
      - { text: "③ 전송 요구를 받으면 처리 가능한 형태로 시행령이 정한 방식·기한에 따라 전송", checks: [prv-portability] }
  - id: "제36조"
    title: "개인정보의 정정ㆍ삭제"
    group: "개인정보 보호법"
    points:
      - { text: "② 정정·삭제 요구를 받으면 지체 없이(10일 이내) 조사·조치하고 결과 통지", checks: [prv-request-days] }
      - { text: "③ 삭제 시 복구·재생되지 않도록 조치", checks: [prv-erase-request] }
      - { text: "④ 다른 법령상 수집 대상이라 삭제할 수 없으면 지체 없이 사유 통지", checks: [prv-rights-refuse] }
      - { text: "영 제43조① 수집보다 어렵지 않은 정정·삭제 요구 방법 마련", checks: [prv-rights, prv-quality] }
      - { text: "영 제43조② 제공받은 개인정보는 제공한 기관에 정정·삭제 요구를 지체 없이 알림", checks: [prv-correct-source] }
  - id: "제37조"
    title: "개인정보의 처리정지 등"
    group: "개인정보 보호법"
    points:
      - { text: "영 제44조① 수집보다 어렵지 않은 처리정지·동의 철회 방법 마련", checks: [prv-rights] }
      - { text: "② 처리정지 요구를 받으면 지체 없이(10일 이내) 전부 또는 일부 정지", checks: [prv-request-days] }
      - { text: "③⑤ 동의 철회나 처리정지된 개인정보는 지체 없이 파기 등 조치", checks: [prv-withdraw] }
      - { text: "④ 처리정지 거절이나 철회 조치 미이행 시 지체 없이 사유 통지", checks: [prv-rights-refuse] }
  - id: "제37조의2"
    title: "자동화된 결정에 대한 정보주체의 권리 등"
    group: "개인정보 보호법"
    points:
      - { text: "③ 거부 시 자동화된 결정 미적용·인적 재처리, 설명 요구 시 설명 등 조치", checks: [prv-auto] }
      - { text: "③ 거부·설명등요구를 받은 날부터 30일 이내에 조치(시행령 제44조의3⑤)", checks: [prv-auto-days] }
      - { text: "④ 자동화된 결정의 기준·절차와 처리 방식을 쉽게 확인할 수 있게 공개", checks: [prv-auto-disclose] }
  - id: "제38조"
    title: "권리행사의 방법 및 절차"
    group: "개인정보 보호법"
    points:
      - { text: "①② 대리인과 아동의 법정대리인의 열람등요구를 받고 본인·대리인 여부 확인", checks: [prv-rights-agent] }
      - { text: "③ 수수료·우송료는 실비 범위로 하고 처리자 사유면 청구 금지", checks: [prv-rights-fee] }
      - { text: "④ 열람등요구의 구체적 방법·절차를 수집보다 어렵지 않게 마련·공개", checks: [prv-rights] }
      - { text: "⑤ 거절 등에 대한 이의제기 절차를 마련·안내", checks: [prv-rights, prv-rights-refuse] }
  - id: "제39조의7"
    title: "손해배상의 보장"
    group: "개인정보 보호법"
    points:
      - { text: "① 손해배상책임 이행을 위해 보험·공제 가입 또는 준비금 적립", checks: [gov-insurance] }
      - { text: "영 제48조의7④ 가입·적립 금액을 최저가입금액 이상으로 유지", checks: [gov-insurance-amount] }
  - id: "제59조"
    title: "금지행위"
    group: "개인정보 보호법"
    points:
      - { text: "1 거짓이나 부정한 수단으로 개인정보 취득·동의 받기 금지", checks: [prv-prohibited] }
      - { text: "2 업무상 알게 된 개인정보 누설·무단 제공 금지", checks: [prv-prohibited, ppl-nda] }
      - { text: "3 권한 없이 또는 권한을 넘어 이용·훼손·변경·유출 금지", checks: [prv-prohibited] }
  - id: "기준 제4조"
    title: "내부 관리계획의 수립ㆍ시행 및 점검"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 내부 의사결정 절차를 거쳐 18개 사항을 담은 내부 관리계획 수립·시행", checks: [gov-internal-plan, gov-policy] }
      - { text: "①10 취약점 점검 시행", checks: [inc-vuln] }
      - { text: "①14 유출사고 대응 계획 수립·시행", checks: [inc-plan] }
      - { text: "①15 위험 분석 및 관리", checks: [gov-risk-method] }
      - { text: "② 교육 목적·대상·내용·일정·방법을 정해 CPO·취급자에게 차등화한 정기 교육", checks: [ppl-training, ppl-training-plan] }
      - { text: "③ 중요한 변경을 즉시 반영해 수정·시행하고 수정 이력 관리", checks: [gov-internal-plan-update] }
      - { text: "④ CPO가 이행 실태를 연 1회 이상 점검·관리", checks: [gov-internal-plan-review] }
  - id: "기준 제5조"
    title: "접근 권한의 관리"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 접근 권한을 업무에 필요한 최소 범위로 차등 부여", checks: [acc-lifecycle] }
      - { text: "② 취급자나 업무 변경 시 접근 권한 지체 없이 변경·말소", checks: [ppl-leave] }
      - { text: "③ 권한 부여·변경·말소 내역 기록과 3년 이상 보관", checks: [acc-history] }
      - { text: "④ 취급자별 계정 발급과 공유 금지", checks: [acc-unique] }
      - { text: "⑤ 취급자·정보주체 인증수단 안전 적용·관리", checks: [acc-password, acc-auth] }
      - { text: "⑥ 일정 횟수 이상 인증 실패 시 접근 제한", checks: [acc-auth] }
  - id: "기준 제6조"
    title: "접근통제"
    group: "안전성 확보조치 기준"
    points:
      - { text: "①1 IP 주소 등으로 접속 권한 제한", checks: [net-segment] }
      - { text: "①2 접속 IP 등 분석으로 유출 시도 탐지·대응", checks: [net-detect] }
      - { text: "② 외부 접속 시 인증서·보안토큰·일회용 비밀번호 등 안전한 인증수단", checks: [acc-remote-mfa] }
      - { text: "③ 홈페이지·P2P·공유설정 등으로 공개·유출되지 않게 조치", checks: [exposure, internet-control] }
      - { text: "④ 일정 시간 업무처리가 없으면 자동 접속 차단", checks: [app-timeout] }
      - { text: "⑤ 업무용 모바일 기기 분실·도난 대비 비밀번호 설정 등 보호조치", checks: [ops-endpoint] }
  - id: "기준 제6조의2"
    title: "인터넷망의 차단 조치 등"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 대상 취급자 컴퓨터의 인터넷망 차단(클라우드는 서비스 접속 외 차단)", checks: [net-separation] }
      - { text: "② 예외는 위험 분석 결과로만, 민감·암호화 대상 정보를 다운로드·파기할 수 있는 취급자는 예외 불가", checks: [net-separation-exception] }
  - id: "기준 제7조"
    title: "개인정보의 암호화"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 인증정보 암호화 저장·송수신, 비밀번호는 일방향 암호화", checks: [cry-password] }
      - { text: "② 이용자의 고유식별정보·카드·계좌·생체인식정보 암호화 저장", checks: [cry-store] }
      - { text: "③ 이용자가 아닌 정보주체의 고유식별정보 저장 위치별 암호화", checks: [cry-store-nonuser] }
      - { text: "④ 인터넷망 구간 송수신 암호화", checks: [cry-transit] }
      - { text: "⑤ 취급자 컴퓨터·모바일·보조저장매체 저장 시 암호화", checks: [cry-endpoint] }
      - { text: "⑥ 대규모 처리자는 암호 키 생성·이용·보관·배포·파기 절차 수립·시행", checks: [cry-key] }
  - id: "기준 제8조"
    title: "접속기록의 보관 및 점검"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 식별자·접속일시·접속지·처리한 정보주체·수행업무를 담은 접속기록을 1년(대상은 2년) 이상 보관", checks: [log-fields, log-retention] }
      - { text: "② 접속기록·다운로드 점검 주기·방법·사후조치를 내부 관리계획으로 정해 이행", checks: [log-review] }
      - { text: "③ 위변조·도난·분실 방지를 위한 안전한 보관", checks: [log-protect] }
  - id: "기준 제9조"
    title: "악성프로그램 등 방지"
    group: "안전성 확보조치 기준"
    points:
      - { text: "①1 보안 프로그램 설치·운영과 자동 또는 일 1회 이상 업데이트", checks: [ops-malware] }
      - { text: "①2 발견된 악성프로그램 삭제 등 대응", checks: [ops-malware, ops-malware-response] }
      - { text: "② 악성프로그램 경보·보안 업데이트 공지 시 즉시 업데이트", checks: [ops-patch] }
  - id: "기준 제10조"
    title: "물리적 안전조치"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 전산실·자료보관실 출입통제 절차 수립·운영", checks: [phy-access] }
      - { text: "② 개인정보가 포함된 서류·보조저장매체 잠금장치 보관", checks: [phy-office, ops-media] }
      - { text: "③ 보조저장매체 반출·입 통제 보안대책", checks: [phy-media-inout] }
  - id: "기준 제11조"
    title: "재해ㆍ재난 대비 안전조치"
    group: "안전성 확보조치 기준"
    points:
      - { text: "1 위기대응 매뉴얼 등 대응절차 마련과 정기 점검", checks: [dr-plan, dr-test] }
      - { text: "2 개인정보처리시스템 백업·복구 계획 마련", checks: [dr-plan, ops-backup] }
  - id: "기준 제12조"
    title: "출력ㆍ복사시 안전조치"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 출력 시 용도를 특정하고 출력 항목 최소화", checks: [app-access] }
      - { text: "② 출력물·복사물 안전 관리", checks: [ops-print, phy-office] }
  - id: "기준 제13조"
    title: "개인정보의 파기"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 완전파괴·소자·초기화나 덮어쓰기 중 하나로 파기", checks: [prv-destroy, ops-dispose] }
      - { text: "② 일부 파기 시 전자파일은 복구 불가 관리·감독, 서면 등은 마스킹·천공", checks: [prv-destroy-partial] }
      - { text: "③ 파기가 현저히 곤란하면 익명정보로 처리", checks: [prv-destroy-partial] }
  - id: "기준 제15조"
    title: "공공시스템운영기관의 내부 관리계획의 수립ㆍ시행"
    group: "안전성 확보조치 기준"
    points:
      - { text: "1·2 공공시스템별 관리책임자 지정과 역할·책임", checks: [pub-plan] }
      - { text: "3~5 취급자 역할, 관리·감독·교육, 접근권한·접근통제·접속기록, 제16~18조 사항 포함", checks: [pub-plan] }
  - id: "기준 제16조"
    title: "공공시스템운영기관의 접근 권한의 관리"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 접근 권한 부여·변경·말소 시 인사정보와 연계", checks: [pub-access, pub-account-hr] }
      - { text: "② 인사정보 미등록자 계정 발급 금지(긴급 시 사유 기록)", checks: [pub-account-hr] }
      - { text: "③ 계정 발급 시 개인정보 보호 교육과 보안 서약", checks: [pub-account-edu] }
      - { text: "④ 권한 부여·변경·말소 내역 반기 1회 이상 점검", checks: [acc-review, pub-access] }
  - id: "기준 제17조"
    title: "공공시스템운영기관의 접속기록의 보관 및 점검"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 접속기록 자동 분석으로 유출·오남용 시도 탐지와 소명", checks: [pub-log] }
      - { text: "② 이용기관이 소관 취급자 접속기록을 직접 점검할 기능 제공", checks: [pub-log-user] }
  - id: "기준 제18조"
    title: "공공시스템운영기관의 취약점 점검 및 조치"
    group: "안전성 확보조치 기준"
    points:
      - { text: "① 공공시스템별 연 1회 이상 취약점 점검", checks: [inc-vuln] }
      - { text: "② 외부 전문가 침투테스트 연 1회 이상", checks: [inc-public-pentest] }
      - { text: "③ 점검 결과에 따른 보완조치 지체 없이 시행", checks: [inc-vuln-fix] }
