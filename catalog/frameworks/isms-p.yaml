id: ismsp
title: ISMS-P 인증기준
source: ismsp-notice
note: "상세 내용(text)은 인증 고시 별표 7 원문입니다. points는 이 프로젝트가 상세 내용을 확인할 요건으로 나눈 것이며, KISA 안내서의 세부 확인사항과 같지 않습니다."
requirements:
  - id: "1.1.1"
    title: "경영진의 참여"
    group: "관리체계 수립 및 운영"
    text: "최고경영자는 정보보호 및 개인정보보호 관리체계의 수립과 운영활동 전반에 경영진의 참여가 이루어질 수 있도록 보고 및 의사결정 체계를 수립하여 운영하여야 한다."
    points:
      - { text: "관리체계 수립·운영 활동을 경영진에게 보고하는 체계를 수립·운영", checks: [gov-ceo, gov-report] }
      - { text: "경영진이 참여하는 의사결정 체계를 수립·운영", checks: [gov-ceo, gov-mgmt-review] }
  - id: "1.1.2"
    title: "최고책임자의 지정"
    group: "관리체계 수립 및 운영"
    text: "최고경영자는 정보보호 업무를 총괄하는 정보보호 최고책임자와 개인정보보호 업무를 총괄하는 개인정보보호 책임자를 예산ㆍ인력 등 자원을 할당할 수 있는 임원급으로 지정하여야 한다."
    points:
      - { text: "정보보호 최고책임자를 자원을 할당할 수 있는 임원급으로 지정", checks: [gov-ciso] }
      - { text: "개인정보 보호책임자를 자원을 할당할 수 있는 임원급으로 지정", checks: [gov-cpo, gov-cpo-report, gov-cpo-report-months] }
  - id: "1.1.3"
    title: "조직 구성"
    group: "관리체계 수립 및 운영"
    text: "최고경영자는 정보보호와 개인정보보호의 효과적 구현을 위한 실무조직, 조직 전반의 정보보호와 개인정보보호 관련 주요 사항을 검토 및 의결할 수 있는 위원회, 전사적 보호활동을 위한 부서별 정보보호와 개인정보보호 담당자로 구성된 협의체를 구성하여 운영하여야 한다."
    points:
      - { text: "정보보호·개인정보보호 실무조직 구성·운영", checks: [gov-org, gov-team] }
      - { text: "주요 사항을 검토·의결하는 위원회 구성·운영", checks: [gov-org, gov-committee] }
      - { text: "부서별 담당자로 구성된 협의체 구성·운영", checks: [gov-org, gov-council] }
  - id: "1.1.4"
    title: "범위 설정"
    group: "관리체계 수립 및 운영"
    text: "조직의 핵심 서비스와 개인정보 처리 현황 등을 고려하여 관리체계 범위를 설정하고, 관련된 서비스를 비롯하여 개인정보 처리 업무와 조직, 자산, 물리적 위치 등을 문서화하여야 한다."
    points:
      - { text: "핵심 서비스와 개인정보 처리 현황을 고려해 관리체계 범위 설정", checks: [gov-scope] }
      - { text: "범위 내 서비스, 개인정보 처리 업무, 조직, 자산, 물리적 위치 문서화", checks: [gov-scope-detail] }
  - id: "1.1.5"
    title: "정책 수립"
    group: "관리체계 수립 및 운영"
    text: "정보보호와 개인정보보호 정책 및 시행문서를 수립ㆍ작성하며, 이때 조직의 정보보호와 개인정보보호 방침 및 방향을 명확하게 제시하여야 한다. 또한 정책과 시행문서는 경영진 승인을 받고, 임직원 및 관련자에게 이해하기 쉬운 형태로 전달하여야 한다."
    points:
      - { text: "방침과 방향을 명확히 제시하는 정책과 시행문서 수립·작성", checks: [gov-policy, gov-internal-plan, pub-plan] }
      - { text: "정책과 시행문서의 경영진 승인", checks: [gov-policy] }
      - { text: "임직원과 관련자에게 이해하기 쉬운 형태로 전달", checks: [gov-policy-comm] }
  - id: "1.1.6"
    title: "자원 할당"
    group: "관리체계 수립 및 운영"
    text: "최고경영자는 정보보호와 개인정보보호 분야별 전문성을 갖춘 인력을 확보하고, 관리체계의 효과적 구현과 지속적운영을 위한 예산 및 자원을 할당하여야 한다."
    points:
      - { text: "분야별 전문성을 갖춘 인력 확보", checks: [gov-staff] }
      - { text: "관리체계 구현과 지속 운영을 위한 예산·자원 할당", checks: [gov-ceo] }
  - id: "1.2.1"
    title: "정보자산 식별"
    group: "관리체계 수립 및 운영"
    text: "조직의 업무특성에 따라 정보자산 분류기준을 수립하여 관리체계 범위 내 모든 정보자산을 식별ㆍ분류하고, 중요도를 산정한 후 그 목록을 최신으로 관리하여야 한다."
    points:
      - { text: "업무특성에 따른 정보자산 분류기준 수립", checks: [gov-asset-class] }
      - { text: "범위 내 모든 정보자산 식별·분류, 중요도 산정, 목록 최신 관리", checks: [gov-asset] }
  - id: "1.2.2"
    title: "현황 및 흐름분석"
    group: "관리체계 수립 및 운영"
    text: "관리체계 전 영역에 대한 정보서비스 및 개인정보 처리 현황을 분석하고 업무 절차와 흐름을 파악하여 문서화하며, 이를 주기적으로 검토하여 최신성을 유지하여야 한다."
    points:
      - { text: "정보서비스·개인정보 처리 현황 분석과 업무 절차·흐름 문서화", checks: [gov-flow] }
      - { text: "주기적 검토로 최신성 유지", checks: [gov-flow-review] }
  - id: "1.2.3"
    title: "위험 평가"
    group: "관리체계 수립 및 운영"
    text: "조직의 대내외 환경분석을 통해 유형별 위협정보를 수집하고 조직에 적합한 위험 평가 방법을 선정하여 관리체계 전 영역에 대하여 연 1회 이상 위험을 평가하며, 수용할 수 있는 위험은 경영진의 승인을 받아 관리하여야 한다."
    points:
      - { text: "대내외 환경분석으로 유형별 위협정보 수집", checks: [gov-threat] }
      - { text: "조직에 적합한 위험 평가 방법을 선정해 관리체계 전 영역을 연 1회 이상 평가", checks: [gov-risk-method] }
      - { text: "수용할 수 있는 위험은 경영진 승인을 받아 관리", checks: [gov-risk-accept] }
  - id: "1.2.4"
    title: "보호대책 선정"
    group: "관리체계 수립 및 운영"
    text: "위험 평가 결과에 따라 식별된 위험을 처리하기 위하여 조직에 적합한 보호대책을 선정하고, 보호대책의 우선순위와 일정ㆍ담당자ㆍ예산 등을 포함한 이행계획을 수립하여 경영진의 승인을 받아야 한다."
    points:
      - { text: "식별된 위험을 처리할 보호대책 선정", checks: [gov-risk-treat] }
      - { text: "우선순위·일정·담당자·예산을 포함한 이행계획 수립과 경영진 승인", checks: [gov-risk-plan] }
  - id: "1.3.1"
    title: "보호대책 구현"
    group: "관리체계 수립 및 운영"
    text: "선정한 보호대책은 이행계획에 따라 효과적으로 구현하고, 경영진은 이행결과의 정확성과 효과성 여부를 확인하여야 한다."
    points:
      - { text: "선정한 보호대책을 이행계획에 따라 구현", checks: [gov-implement] }
      - { text: "경영진이 이행결과의 정확성과 효과성 확인", checks: [gov-implement-review] }
  - id: "1.3.2"
    title: "보호대책 공유"
    group: "관리체계 수립 및 운영"
    text: "보호대책의 실제 운영 또는 시행할 부서 및 담당자를 파악하여 관련 내용을 공유하고 교육하여 지속적으로 운영되도록 하여야 한다."
    points:
      - { text: "보호대책을 운영·시행할 부서와 담당자 파악", checks: [gov-share] }
      - { text: "관련 내용을 공유·교육해 지속 운영", checks: [gov-share-edu] }
  - id: "1.3.3"
    title: "운영현황 관리"
    group: "관리체계 수립 및 운영"
    text: "조직이 수립한 관리체계에 따라 상시적 또는 주기적으로 수행하여야 하는 운영활동 및 수행 내역은 식별 및 추적이 가능하도록 기록하여 관리하고, 경영진은 주기적으로운영활동의 효과성을 확인하여 관리하여야 한다."
    points:
      - { text: "상시·주기적 운영활동과 수행 내역을 식별·추적 가능하게 기록·관리", checks: [gov-operation] }
      - { text: "경영진이 운영활동의 효과성을 주기적으로 확인", checks: [gov-operation-review] }
  - id: "1.4.1"
    title: "법적 요구사항 준수 검토"
    group: "관리체계 수립 및 운영"
    text: "조직이 준수하여야 할 정보보호 및 개인정보보호 관련 법적 요구사항을 주기적으로 파악하여 규정에 반영하고, 준수 여부를 지속적으로 검토하여야 한다."
    points:
      - { text: "법적 요구사항을 주기적으로 파악", checks: [gov-legal] }
      - { text: "파악한 법적 요구사항을 규정에 반영", checks: [gov-legal-reflect] }
      - { text: "법적 요구사항 준수 여부를 지속적으로 검토", checks: [gov-legal, gov-insurance, gov-domestic-agent, gov-level-eval, gov-level-eval-fix, gov-domestic-agent-cycle, gov-insurance-amount] }
  - id: "1.4.2"
    title: "관리체계 점검"
    group: "관리체계 수립 및 운영"
    text: "관리체계가 내부 정책 및 법적 요구사항에 따라 효과적으로운영되고 있는지 독립성과 전문성이 확보된 인력을 구성하여 연 1회 이상 점검하고, 발견된 문제점을 경영진에게 보고하여야 한다."
    points:
      - { text: "독립성과 전문성이 확보된 점검 인력 구성", checks: [gov-auditor] }
      - { text: "내부 정책·법적 요구사항에 따른 운영 여부를 연 1회 이상 점검", checks: [gov-audit, gov-internal-plan-review] }
      - { text: "발견된 문제점을 경영진에게 보고", checks: [gov-audit] }
  - id: "1.4.3"
    title: "관리체계 개선"
    group: "관리체계 수립 및 운영"
    text: "법적 요구사항 준수검토 및 관리체계 점검을 통해 식별된 관리체계상의 문제점에 대한 원인을 분석하고 재발방지 대책을 수립ㆍ이행하여야 하며, 경영진은 개선 결과의 정 확성과 효과성 여부를 확인하여야 한다."
    points:
      - { text: "식별된 문제점의 원인 분석과 재발방지 대책 수립·이행", checks: [gov-improve] }
      - { text: "경영진이 개선 결과의 정확성과 효과성 확인", checks: [gov-improve-review] }
  - id: "2.1.1"
    title: "정책의 유지관리"
    group: "보호대책 요구사항"
    text: "정보보호 및 개인정보보호 관련 정책과 시행문서는 법령 및 규제, 상위 조직 및 관련 기관 정책과의 연계성, 조직의 대내외 환경변화 등에 따라 주기적으로 검토하여 필요한 경우 제ㆍ개정하고 그 내역을 이력관리하여야 한다."
    points:
      - { text: "법령·상위 정책·환경변화에 따라 주기적으로 검토하고 필요 시 제·개정", checks: [gov-policy-review] }
      - { text: "제·개정 내역 이력관리", checks: [gov-policy-history] }
  - id: "2.1.2"
    title: "조직의 유지관리"
    group: "보호대책 요구사항"
    text: "조직의 각 구성원에게 정보보호와 개인정보보호 관련 역할 및 책임을 할당하고, 그 활동을 평가할 수 있는 체계와 조직 및 조직의 구성원 간 상호 의사소통할 수 있는 체계를 수립하여 운영하여야 한다."
    points:
      - { text: "구성원에게 정보보호·개인정보보호 역할과 책임 할당", checks: [gov-org, gov-roles] }
      - { text: "역할 수행 활동을 평가하는 체계 수립·운영", checks: [gov-org, gov-eval] }
      - { text: "조직과 구성원 간 의사소통 체계 수립·운영", checks: [gov-comm] }
  - id: "2.1.3"
    title: "정보자산 관리"
    group: "보호대책 요구사항"
    text: "정보자산의 용도와 중요도에 따른 취급 절차 및 보호대책을 수립ㆍ이행하고, 자산별 책임소재를 명확히 정의하여 관리하여야 한다."
    points:
      - { text: "용도와 중요도에 따른 취급 절차와 보호대책 수립·이행", checks: [gov-asset-handling] }
      - { text: "자산별 책임소재를 명확히 정의", checks: [gov-asset] }
  - id: "2.2.1"
    title: "주요 직무자 지정 및 관리"
    group: "보호대책 요구사항"
    text: "개인정보 및 중요정보의 취급이나 주요 시스템 접근 등 주요 직무의 기준과 관리방안을 수립하고, 주요 직무자를 최소한으로 지정하여 그 목록을 최신으로 관리하여야 한다."
    points:
      - { text: "주요 직무의 기준과 관리방안 수립", checks: [ppl-key-criteria] }
      - { text: "주요 직무자를 최소한으로 지정하고 목록을 최신으로 관리", checks: [ppl-key] }
  - id: "2.2.2"
    title: "직무 분리"
    group: "보호대책 요구사항"
    text: "권한 오ㆍ남용 등으로 인한 잠재적인 피해 예방을 위하여 직무 분리 기준을 수립하고 적용하여야 한다. 다만 불가피하게 직무 분리가 어려운 경우 별도의 보완대책을 마련하여 이행하여야 한다."
    points:
      - { text: "직무 분리 기준 수립·적용", checks: [ppl-sod] }
      - { text: "직무 분리가 어려운 경우 보완대책 마련·이행", checks: [ppl-sod-comp] }
  - id: "2.2.3"
    title: "보안 서약"
    group: "보호대책 요구사항"
    text: "정보자산을 취급하거나 접근권한이 부여된 임직원ㆍ임시 직원ㆍ외부자 등이 내부 정책 및 관련 법규, 비밀유지 의무 등 준수사항을 명확히 인지할 수 있도록 업무 특성에 따른 정보보호 서약을 받아야 한다."
    points:
      - { text: "임직원·임시 직원·외부자 등에게 업무 특성에 따른 정보보호 서약 징구", checks: [ppl-nda] }
      - { text: "내부 정책·관련 법규·비밀유지 의무 등 준수사항을 명확히 인지하게 함", checks: [ppl-nda-content, prv-prohibited] }
  - id: "2.2.4"
    title: "인식제고 및 교육훈련"
    group: "보호대책 요구사항"
    text: "임직원 및 관련 외부자가 조직의 관리체계와 정책을 이해하고 직무별 전문성을 확보할 수 있도록 연간 인식제고 활동 및 교육훈련 계획을 수립ㆍ운영하고, 그 결과에 따른 효과성을 평가하여 다음 계획에 반영하여야 한다."
    points:
      - { text: "연간 인식제고 활동 및 교육훈련 계획 수립", checks: [ppl-training-plan] }
      - { text: "임직원·관련 외부자 대상 직무별 교육훈련 운영", checks: [ppl-training] }
      - { text: "교육 효과성 평가와 다음 계획 반영", checks: [ppl-training-eval] }
  - id: "2.2.5"
    title: "퇴직 및 직무변경 관리"
    group: "보호대책 요구사항"
    text: "퇴직 및 직무변경 시 인사ㆍ정보보호ㆍ개인정보보호ㆍIT 등 관련 부서별 이행하여야 할 자산반납, 계정 및 접근권한 회수ㆍ조정, 결과확인 등의 절차를 수립ㆍ관리하여야 한다."
    points:
      - { text: "퇴직·직무변경 시 부서별 이행 절차 수립", checks: [ppl-leave-proc] }
      - { text: "자산반납, 계정·접근권한 회수·조정, 결과확인 이행", checks: [ppl-leave] }
  - id: "2.2.6"
    title: "보안 위반 시 조치"
    group: "보호대책 요구사항"
    text: "임직원 및 관련 외부자가 법령, 규제 및 내부정책을 위반한 경우 이에 따른 조치 절차를 수립ㆍ이행하여야 한다."
    points:
      - { text: "법령·규제·내부정책 위반 시 조치 절차 수립", checks: [ppl-discipline] }
      - { text: "위반 발생 시 조치 절차 이행", checks: [ppl-violation] }
  - id: "2.3.1"
    title: "외부자 현황 관리"
    group: "보호대책 요구사항"
    text: "업무의 일부(개인정보취급, 정보보호, 정보시스템 운영 또는 개발 등)를 외부에 위탁하거나 외부의 시설 또는 서 비스(집적정보통신시설, 클라우드 서비스, 애플리케이션 서비스 등)를 이용하는 경우 그 현황을 식별하고 법적 요구사항 및 외부 조직ㆍ서비스로부터 발생되는 위험을 파악하여 적절한 보호대책을 마련하여야 한다."
    points:
      - { text: "업무 위탁과 외부 시설·서비스 이용 현황 식별", checks: [sup-inventory] }
      - { text: "법적 요구사항과 외부 조직·서비스로부터 발생하는 위험 파악", checks: [sup-risk] }
      - { text: "위험에 따른 보호대책 마련", checks: [sup-control] }
  - id: "2.3.2"
    title: "외부자 계약 시 보안"
    group: "보호대책 요구사항"
    text: "외부 서비스를 이용하거나 외부자에게 업무를 위탁하는 경우 이에 따른 정보보호 및 개인정보보호 요구사항을 식별하고, 관련 내용을 계약서 또는 협정서 등에 명시하여야 한다."
    points:
      - { text: "외부 서비스 이용·업무 위탁에 따른 정보보호·개인정보보호 요구사항 식별", checks: [sup-req] }
      - { text: "요구사항을 계약서 또는 협정서에 명시", checks: [sup-contract, sup-contract-sec] }
  - id: "2.3.3"
    title: "외부자 보안 이행 관리"
    group: "보호대책 요구사항"
    text: "계약서, 협정서, 내부정책에 명시된 정보보호 및 개인정보보호 요구사항에 따라 외부자의 보호대책 이행 여부를 주기적인 점검 또는 감사 등 관리ㆍ감독하여야 한다."
    points:
      - { text: "외부자의 보호대책 이행 여부를 주기적 점검·감사 등으로 관리·감독", checks: [sup-monitor] }
  - id: "2.3.4"
    title: "외부자 계약 변경 및 만료 시 보안"
    group: "보호대책 요구사항"
    text: "외부자 계약만료, 업무종료, 담당자 변경 시에는 제공한 정보자산 반납, 정보시스템 접근계정 삭제, 중요정보 파기, 업무 수행 중 취득정보의 비밀유지 확약서 징구 등의 보호대책을 이행하여야 한다."
    points:
      - { text: "계약만료·업무종료·담당자 변경 시 정보자산 반납, 접근계정 삭제, 중요정보 파기", checks: [sup-end] }
      - { text: "업무 중 취득정보에 대한 비밀유지 확약서 징구", checks: [sup-end-nda] }
  - id: "2.4.1"
    title: "보호구역 지정"
    group: "보호대책 요구사항"
    text: "물리적ㆍ환경적 위협으로부터 개인정보 및 중요정보, 문서, 저장매체, 주요 설비 및 시스템 등을 보호하기 위하여 통제구역ㆍ제한구역ㆍ접견구역 등 물리적 보호구역을 지정하고 각 구역별 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "통제구역·제한구역·접견구역 등 물리적 보호구역 지정", checks: [phy-zone] }
      - { text: "구역별 보호대책 수립·이행", checks: [phy-zone-measure] }
  - id: "2.4.2"
    title: "출입통제"
    group: "보호대책 요구사항"
    text: "보호구역은 인가된 사람만이 출입하도록 통제하고 책임추 적성을 확보할 수 있도록 출입 및 접근 이력을 주기적으로 검토하여야 한다."
    points:
      - { text: "보호구역에 인가된 사람만 출입하도록 통제", checks: [phy-access] }
      - { text: "출입 및 접근 이력을 주기적으로 검토", checks: [phy-access-review] }
  - id: "2.4.3"
    title: "정보시스템 보호"
    group: "보호대책 요구사항"
    text: "정보시스템은 환경적 위협과 유해요소, 비인가 접근 가능성을 감소시킬 수 있도록 중요도와 특성을 고려하여 배치하고, 통신 및 전력 케이블이 손상을 입지 않도록 보호하여야 한다."
    points:
      - { text: "중요도와 특성을 고려한 정보시스템 배치", checks: [phy-equip] }
      - { text: "통신·전력 케이블 손상 방지", checks: [phy-cable] }
  - id: "2.4.4"
    title: "보호설비 운영"
    group: "보호대책 요구사항"
    text: "보호구역에 위치한 정보시스템의 중요도 및 특성에 따라 온도ㆍ습도 조절, 화재감지, 소화설비, 누수감지, UPS, 비상발전기, 이중전원선 등의 보호설비를 갖추고 운영절차를 수립ㆍ운영하여야 한다."
    points:
      - { text: "중요도·특성에 따른 보호설비(온습도, 화재·누수 감지, 소화, UPS, 비상발전기, 이중전원 등) 구비", checks: [phy-facility] }
      - { text: "보호설비 운영절차 수립·운영", checks: [phy-facility-proc] }
  - id: "2.4.5"
    title: "보호구역 내 작업"
    group: "보호대책 요구사항"
    text: "보호구역 내에서의 비인가행위 및 권한 오ㆍ남용 등을 방지하기 위한 작업 절차를 수립ㆍ이행하고, 작업 기록을 주기적으로 검토하여야 한다."
    points:
      - { text: "비인가행위·권한 오남용을 방지하는 작업 절차 수립·이행", checks: [phy-work] }
      - { text: "작업 기록을 주기적으로 검토", checks: [phy-work-review] }
  - id: "2.4.6"
    title: "반출입 기기 통제"
    group: "보호대책 요구사항"
    text: "보호구역 내 정보시스템, 모바일 기기, 저장매체 등에 대한 반출입 통제절차를 수립ㆍ이행하고 주기적으로 검토하여야 한다."
    points:
      - { text: "정보시스템·모바일 기기·저장매체 반출입 통제절차 수립·이행", checks: [phy-media-inout] }
      - { text: "반출입 내역을 주기적으로 검토", checks: [phy-inout-review] }
  - id: "2.4.7"
    title: "업무환경 보안"
    group: "보호대책 요구사항"
    text: "공용으로 사용하는 사무용 기기(문서고, 공용 PC, 복합기, 파일서버 등) 및 개인 업무환경(업무용 PC, 책상 등)을 통해 개인정보 및 중요정보가 비인가자에게 노출 또는 유출되지 않도록 클린데스크, 정기점검 등 업무환경 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "공용 사무용 기기(문서고, 공용 PC, 복합기, 파일서버 등) 보호대책", checks: [phy-shared, ops-print] }
      - { text: "개인 업무환경(업무용 PC, 책상 등) 클린데스크 등 보호대책", checks: [phy-office] }
      - { text: "업무환경 보호대책 정기점검", checks: [phy-office-check] }
  - id: "2.5.1"
    title: "사용자 계정 관리"
    group: "보호대책 요구사항"
    text: "정보시스템과 개인정보 및 중요정보에 대한 비인가 접근을 통제하고 업무 목적에 따른 접근권한을 최소한으로 부여할 수 있도록 사용자 등록ㆍ해지 및 접근권한 부여ㆍ변경ㆍ말소 절차를 수립ㆍ이행하고, 사용자 등록 및 권한부여 시 사용자에게 보안책임이 있음을 규정화하고 인식시켜야 한다."
    points:
      - { text: "사용자 등록·해지와 접근권한 부여·변경·말소 절차 수립·이행", checks: [acc-lifecycle, acc-history, pub-access, pub-account-hr, pub-account-edu] }
      - { text: "업무 목적에 따라 접근권한을 최소한으로 부여", checks: [acc-lifecycle] }
      - { text: "등록·권한부여 시 사용자의 보안책임을 규정화하고 인식", checks: [acc-duty] }
  - id: "2.5.2"
    title: "사용자 식별"
    group: "보호대책 요구사항"
    text: "사용자 계정은 사용자별로 유일하게 구분할 수 있도록 식 별자를 할당하고 추측 가능한 식별자 사용을 제한하여야 하며, 동일한 식별자를 공유하여 사용하는 경우 그 사유와 타당성을 검토하여 책임자의 승인 및 책임추적성 확보 등 보완대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "사용자별로 유일한 식별자 할당", checks: [acc-unique] }
      - { text: "추측 가능한 식별자 사용 제한", checks: [acc-guess-id] }
      - { text: "식별자 공유 시 사유·타당성 검토, 책임자 승인, 책임추적성 확보", checks: [acc-shared] }
  - id: "2.5.3"
    title: "사용자 인증"
    group: "보호대책 요구사항"
    text: "정보시스템과 개인정보 및 중요정보에 대한 사용자의 접근은 안전한 인증절차와 필요에 따라 강화된 인증방식을 적용하여야 한다. 또한 로그인 횟수 제한, 불법 로그인 시도 경고 등 비인가자 접근 통제방안을 수립ㆍ이행하여야 한다."
    points:
      - { text: "안전한 인증절차 적용", checks: [acc-auth] }
      - { text: "필요에 따라 강화된 인증방식 적용", checks: [acc-mfa, acc-remote-mfa] }
      - { text: "로그인 횟수 제한, 불법 로그인 시도 경고 등 비인가자 접근 통제", checks: [acc-auth, acc-login-alert] }
  - id: "2.5.4"
    title: "비밀번호 관리"
    group: "보호대책 요구사항"
    text: "법적 요구사항, 외부 위협요인 등을 고려하여 정보시스템 사용자 및 고객, 회원 등 정보주체(이용자)가 사용하는 비밀번호 관리절차를 수립ㆍ이행하여야 한다."
    points:
      - { text: "정보시스템 사용자 비밀번호 관리절차 수립·이행", checks: [acc-password, cry-password] }
      - { text: "정보주체(이용자) 비밀번호 관리절차 수립·이행", checks: [acc-user-password, cry-password] }
  - id: "2.5.5"
    title: "특수 계정 및 권한 관리"
    group: "보호대책 요구사항"
    text: "정보시스템 관리, 개인정보 및 중요정보 관리 등 특수 목적을 위하여 사용하는 계정 및 권한은 최소한으로 부여하고 별도로 식별하여 통제하여야 한다."
    points:
      - { text: "특수 목적 계정과 권한을 최소한으로 부여", checks: [acc-privileged] }
      - { text: "특수 계정과 권한을 별도로 식별해 통제", checks: [acc-priv-identify] }
  - id: "2.5.6"
    title: "접근권한 검토"
    group: "보호대책 요구사항"
    text: "정보시스템과 개인정보 및 중요정보에 접근하는 사용자 계정의 등록ㆍ이용ㆍ삭제 및 접근권한의 부여ㆍ변경ㆍ삭제 이력을 남기고 주기적으로 검토하여 적정성 여부를 점검하여야 한다."
    points:
      - { text: "계정 등록·이용·삭제와 접근권한 부여·변경·삭제 이력 기록", checks: [acc-account-log, acc-history] }
      - { text: "이력을 주기적으로 검토해 적정성 점검", checks: [acc-review, pub-access] }
  - id: "2.6.1"
    title: "네트워크 접근"
    group: "보호대책 요구사항"
    text: "네트워크에 대한 비인가 접근을 통제하기 위하여 IP관리, 단말인증 등 관리절차를 수립ㆍ이행하고, 업무목적 및 중요도에 따라 네트워크 분리(DMZ, 서버팜, DB존, 개발존 등)와 접근통제를 적용하여야 한다."
    points:
      - { text: "IP관리, 단말인증 등 네트워크 비인가 접근 관리절차 수립·이행", checks: [net-ip] }
      - { text: "업무목적·중요도에 따른 네트워크 분리(DMZ, 서버팜, DB존, 개발존 등)", checks: [net-segment] }
      - { text: "분리된 영역 간 접근통제 적용", checks: [net-acl] }
  - id: "2.6.2"
    title: "정보시스템 접근"
    group: "보호대책 요구사항"
    text: "서버, 네트워크시스템 등 정보시스템에 접근을 허용하는 사용자, 접근제한 방식, 안전한 접근수단 등을 정의하여 통제하여야 한다."
    points:
      - { text: "정보시스템별 접근 허용 사용자 정의·통제", checks: [sys-users] }
      - { text: "접근제한 방식과 안전한 접근수단 정의·통제", checks: [sys-access] }
  - id: "2.6.3"
    title: "응용프로그램 접근"
    group: "보호대책 요구사항"
    text: "사용자별 업무 및 접근 정보의 중요도 등에 따라 응용프로그램 접근권한을 제한하고, 불필요한 정보 또는 중요정보 노출을 최소화할 수 있도록 기준을 수립하여 적용하여야 한다."
    points:
      - { text: "업무와 정보 중요도에 따라 응용프로그램 접근권한 제한", checks: [app-access, app-timeout] }
      - { text: "불필요한 정보·중요정보 노출 최소화 기준 수립·적용", checks: [app-mask] }
  - id: "2.6.4"
    title: "데이터베이스 접근"
    group: "보호대책 요구사항"
    text: "테이블 목록 등 데이터베이스 내에서 저장ㆍ관리되고 있는 정보를 식별하고, 정보의 중요도와 응용프로그램 및 사용자 유형 등에 따른 접근통제 정책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "테이블 목록 등 데이터베이스 내 저장 정보 식별", checks: [db-inventory] }
      - { text: "정보 중요도와 응용프로그램·사용자 유형에 따른 접근통제 정책 수립·이행", checks: [db-access] }
  - id: "2.6.5"
    title: "무선 네트워크 접근"
    group: "보호대책 요구사항"
    text: "무선 네트워크를 사용하는 경우 사용자 인증, 송수신 데이터 암호화, AP 통제 등 무선 네트워크 보호대책을 적용하여야 한다. 또한 AD Hoc 접속, 비인가 AP 사용 등 비인가 무선 네트워크 접속으로부터 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "무선 네트워크 사용자 인증, 송수신 데이터 암호화, AP 통제", checks: [wifi] }
      - { text: "AD Hoc 접속, 비인가 AP 등 비인가 무선 접속 보호대책", checks: [net-rogue-ap] }
  - id: "2.6.6"
    title: "원격접근 통제"
    group: "보호대책 요구사항"
    text: "보호구역 이외 장소에서의 정보시스템 관리 및 개인정보 처리는 원칙적으로 금지하고, 재택근무ㆍ장애대응ㆍ원격 협업 등 불가피한 사유로 원격접근을 허용하는 경우 책임자 승인, 접근 단말 지정, 접근 허용범위 및 기간 설정, 강화된 인증, 구간 암호화, 접속단말 보안(백신, 패치 등) 등 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "보호구역 외 장소에서의 시스템 관리·개인정보 처리 원칙적 금지", checks: [remote-policy] }
      - { text: "원격접근 허용 시 책임자 승인, 접근 단말 지정, 허용범위·기간 설정", checks: [remote] }
      - { text: "원격접근 시 강화된 인증과 구간 암호화", checks: [acc-remote-mfa, remote-vpn] }
      - { text: "원격 접속단말 보안(백신, 패치 등)", checks: [remote-device] }
  - id: "2.6.7"
    title: "인터넷 접속 통제"
    group: "보호대책 요구사항"
    text: "인터넷을 통한 정보 유출, 악성코드 감염, 내부망 침투 등을 예방하기 위하여 주요 정보시스템, 주요 직무 수행 및 개인정보 취급 단말기 등에 대한 인터넷 접속 또는 서비스(P2P, 웹하드, 메신저 등)를 제한하는 등 인터넷 접속 통제 정책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "주요 시스템·주요 직무·개인정보 취급 단말의 인터넷 접속 통제 정책 수립", checks: [net-internet-policy] }
      - { text: "인터넷 접속 또는 P2P·웹하드·메신저 등 서비스 제한 이행", checks: [internet-control, net-separation, net-separation-exception] }
  - id: "2.7.1"
    title: "암호정책 적용"
    group: "보호대책 요구사항"
    text: "개인정보 및 주요정보 보호를 위하여 법적 요구사항을 반영한 암호화 대상, 암호 강도, 암호 사용 정책을 수립하고 개인정보 및 주요정보의 저장ㆍ전송ㆍ전달 시 암호화를 적용하여야 한다."
    points:
      - { text: "법적 요구사항을 반영한 암호화 대상·암호 강도·암호 사용 정책 수립", checks: [cry-policy] }
      - { text: "개인정보·주요정보 저장 시 암호화", checks: [cry-store, cry-password, cry-endpoint, cry-store-nonuser] }
      - { text: "개인정보·주요정보 전송·전달 시 암호화", checks: [cry-transit] }
  - id: "2.7.2"
    title: "암호키 관리"
    group: "보호대책 요구사항"
    text: "암호키의 안전한 생성ㆍ이용ㆍ보관ㆍ배포ㆍ파기를 위한 관리 절차를 수립ㆍ이행하고, 필요 시 복구방안을 마련하여야 한다."
    points:
      - { text: "암호키 생성·이용·보관·배포·파기 관리 절차 수립·이행", checks: [cry-key] }
      - { text: "필요 시 암호키 복구방안 마련", checks: [cry-key-recovery] }
  - id: "2.8.1"
    title: "보안 요구사항 정의"
    group: "보호대책 요구사항"
    text: "정보시스템의 도입ㆍ개발ㆍ변경 시 정보보호 및 개인정보 보호 관련 법적 요구사항, 최신 보안취약점, 안전한 코딩 방법 등 보안 요구사항을 정의하고 적용하여야 한다."
    points:
      - { text: "도입·개발·변경 시 법적 요구사항을 포함한 보안 요구사항 정의·적용", checks: [dev-req] }
      - { text: "최신 보안취약점 대응 요구사항 정의·적용", checks: [dev-vuln-req] }
      - { text: "안전한 코딩 방법 정의·적용", checks: [dev-coding] }
  - id: "2.8.2"
    title: "보안 요구사항 검토 및 시험"
    group: "보호대책 요구사항"
    text: "사전 정의된 보안 요구사항에 따라 정보시스템이 도입 또는 구현되었는지를 검토하기 위하여 법적 요구사항 준수, 최신 보안취약점 점검, 안전한 코딩 구현, 개인정보 영향평가 등의 검토 기준과 절차를 수립ㆍ이행하고, 발견된 문제점에 대한 개선조치를 수행하여야 한다."
    points:
      - { text: "법적 요구사항 준수, 최신 취약점 점검, 안전한 코딩, 개인정보 영향평가 등 검토 기준과 절차 수립", checks: [dev-review-proc] }
      - { text: "기준에 따른 검토·시험 이행과 발견된 문제점 개선조치", checks: [dev-test, gov-pia] }
  - id: "2.8.3"
    title: "시험과 운영 환경 분리"
    group: "보호대책 요구사항"
    text: "개발 및 시험 시스템은 운영시스템에 대한 비인가 접근 및 변경의 위험을 감소시키기 위하여 원칙적으로 분리하여야 한다."
    points:
      - { text: "개발·시험 시스템과 운영시스템의 원칙적 분리", checks: [dev-separate] }
  - id: "2.8.4"
    title: "시험 데이터 보안"
    group: "보호대책 요구사항"
    text: "시스템 시험 과정에서 운영데이터의 유출을 예방하기 위하여 시험 데이터의 생성과 이용 및 관리, 파기, 기술적 보호조치에 관한 절차를 수립ㆍ이행하여야 한다."
    points:
      - { text: "시험 데이터의 생성·이용·관리·파기 절차 수립·이행", checks: [dev-data] }
      - { text: "시험 데이터 기술적 보호조치", checks: [dev-data-protect] }
  - id: "2.8.5"
    title: "소스 프로그램 관리"
    group: "보호대책 요구사항"
    text: "소스 프로그램은 인가된 사용자만이 접근할 수 있도록 관리하고, 운영환경에 보관하지 않는 것을 원칙으로 하여야 한다."
    points:
      - { text: "인가된 사용자만 소스 프로그램에 접근", checks: [dev-source] }
      - { text: "소스 프로그램을 운영환경에 보관하지 않음", checks: [dev-source-prod] }
  - id: "2.8.6"
    title: "운영환경 이관"
    group: "보호대책 요구사항"
    text: "신규 도입ㆍ개발 또는 변경된 시스템을 운영환경으로 이관할 때는 통제된 절차를 따라야 하고, 실행코드는 시험 및 사용자 인수 절차에 따라 실행되어야 한다."
    points:
      - { text: "운영환경 이관 시 통제된 절차 준수", checks: [dev-release] }
      - { text: "실행코드는 시험·사용자 인수 절차에 따라 실행", checks: [dev-uat] }
  - id: "2.9.1"
    title: "변경관리"
    group: "보호대책 요구사항"
    text: "정보시스템 관련 자산의 모든 변경내역을 관리할 수 있도록 절차를 수립ㆍ이행하고, 변경 전 시스템의 성능 및 보안에 미치는 영향을 분석하여야 한다."
    points:
      - { text: "정보시스템 관련 자산의 모든 변경내역 관리 절차 수립·이행", checks: [ops-change] }
      - { text: "변경 전 성능·보안 영향 분석", checks: [ops-change-impact] }
  - id: "2.9.2"
    title: "성능 및 장애관리"
    group: "보호대책 요구사항"
    text: "정보시스템의 가용성 보장을 위하여 성능 및 용량 요구사항을 정의하고 현황을 지속적으로 모니터링하여야 하며, 장애 발생 시 효과적으로 대응하기 위한 탐지ㆍ기록ㆍ분석ㆍ복구ㆍ보고 등의 절차를 수립ㆍ관리하여야 한다."
    points:
      - { text: "성능·용량 요구사항 정의와 지속적 모니터링", checks: [ops-capacity] }
      - { text: "장애 탐지·기록·분석·복구·보고 절차 수립·관리", checks: [ops-outage] }
  - id: "2.9.3"
    title: "백업 및 복구관리"
    group: "보호대책 요구사항"
    text: "정보시스템의 가용성과 데이터 무결성을 유지하기 위하여 백업 대상, 주기, 방법, 보관장소, 보관기간, 소산 등의 절차를 수립ㆍ이행하여야 한다. 아울러 사고 발생 시 적시에 복구할 수 있도록 관리하여야 한다."
    points:
      - { text: "백업 대상·주기·방법·보관장소·보관기간·소산 절차 수립·이행", checks: [ops-backup] }
      - { text: "사고 발생 시 적시에 복구할 수 있도록 관리", checks: [ops-restore] }
  - id: "2.9.4"
    title: "로그 및 접속기록 관리"
    group: "보호대책 요구사항"
    text: "서버, 응용프로그램, 보안시스템, 네트워크시스템 등 정보시스템에 대한 사용자 접속기록, 시스템로그, 권한부여 내역 등의 로그유형, 보존기간, 보존방법 등을 정하고 위ㆍ변조, 도난, 분실 되지 않도록 안전하게 보존ㆍ관리하여야 한다."
    points:
      - { text: "접속기록·시스템로그·권한부여 내역 등 로그유형, 보존기간, 보존방법 결정", checks: [log-policy, log-retention, log-fields] }
      - { text: "로그를 위·변조, 도난, 분실되지 않도록 안전하게 보존·관리", checks: [log-fields, log-protect] }
  - id: "2.9.5"
    title: "로그 및 접속기록 점검"
    group: "보호대책 요구사항"
    text: "정보시스템의 정상적인 사용을 보장하고 사용자 오ㆍ남용 (비인가접속, 과다조회 등)을 방지하기 위하여 접근 및 사용에 대한 로그 검토기준을 수립하여 주기적으로 점검하며, 문제 발생 시 사후조치를 적시에 수행하여야 한다."
    points:
      - { text: "접근·사용 로그 검토기준 수립", checks: [log-criteria] }
      - { text: "로그를 주기적으로 점검", checks: [log-review, pub-log, pub-log-user] }
      - { text: "문제 발생 시 사후조치를 적시에 수행", checks: [log-followup] }
  - id: "2.9.6"
    title: "시간 동기화"
    group: "보호대책 요구사항"
    text: "로그 및 접속기록의 정확성을 보장하고 신뢰성 있는 로그 분석을 위하여 관련 정보시스템의 시각을 표준시각으로 동기화하고 주기적으로 관리하여야 한다."
    points:
      - { text: "관련 정보시스템 시각을 표준시각으로 동기화하고 주기적으로 관리", checks: [log-time] }
  - id: "2.9.7"
    title: "정보자산의 재사용 및 폐기"
    group: "보호대책 요구사항"
    text: "정보자산의 재사용과 폐기 과정에서 개인정보 및 중요정보가 복구ㆍ재생되지 않도록 안전한 재사용 및 폐기 절차를 수립ㆍ이행하여야 한다."
    points:
      - { text: "정보자산 재사용 시 정보가 복구·재생되지 않는 절차 수립·이행", checks: [ops-reuse] }
      - { text: "정보자산 폐기 시 정보가 복구·재생되지 않는 절차 수립·이행", checks: [ops-dispose] }
  - id: "2.10.1"
    title: "보안시스템 운영"
    group: "보호대책 요구사항"
    text: "보안시스템 유형별로 관리자 지정, 최신 정책 업데이트, 룰셋 변경, 이벤트 모니터링 등의 운영절차를 수립ㆍ이행하고 보안시스템별 정책적용 현황을 관리하여야 한다."
    points:
      - { text: "보안시스템 유형별 관리자 지정, 정책 업데이트, 룰셋 변경 등 운영절차 수립·이행", checks: [ops-secdev] }
      - { text: "보안시스템 이벤트 모니터링", checks: [ops-secdev-monitor] }
      - { text: "보안시스템별 정책적용 현황 관리", checks: [ops-secdev-list] }
  - id: "2.10.2"
    title: "클라우드 보안"
    group: "보호대책 요구사항"
    text: "클라우드 서비스 이용 시 서비스 유형(SaaS, PaaS, IaaS 등)에 따른 비인가 접근, 설정 오류 등에 따라 중요정보와 개인정보가 유ㆍ노출되지 않도록 관리자 접근 및 보안 설정 등에 대한 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "클라우드 서비스 유형에 따른 보안 설정 보호대책 수립·이행", checks: [ops-cloud] }
      - { text: "클라우드 관리자 접근 보호대책 수립·이행", checks: [ops-cloud-admin] }
  - id: "2.10.3"
    title: "공개서버 보안"
    group: "보호대책 요구사항"
    text: "외부 네트워크에 공개되는 서버의 경우 내부 네트워크와 분리하고 취약점 점검, 접근통제, 인증, 정보 수집ㆍ저장ㆍ공개 절차 등 강화된 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "공개서버를 내부 네트워크와 분리", checks: [ops-public-server] }
      - { text: "공개서버 취약점 점검, 접근통제, 인증 등 강화된 보호대책", checks: [ops-public-hardening] }
      - { text: "공개서버의 정보 수집·저장·공개 절차", checks: [exposure] }
  - id: "2.10.4"
    title: "전자거래 및 핀테크 보안"
    group: "보호대책 요구사항"
    text: "전자거래 및 핀테크 서비스 제공 시 정보유출이나 데이터 조작ㆍ사기 등의 침해사고 예방을 위해 인증ㆍ암호화 등의 보호대책을 수립하고, 결제시스템 등 외부 시스템과 연계할 경우 안전성을 점검하여야 한다."
    points:
      - { text: "전자거래·핀테크 서비스의 인증·암호화 등 보호대책 수립", checks: [ops-ecommerce] }
      - { text: "결제시스템 등 외부 시스템 연계 시 안전성 점검", checks: [ops-pg-check] }
  - id: "2.10.5"
    title: "정보전송 보안"
    group: "보호대책 요구사항"
    text: "타 조직에 개인정보 및 중요정보를 전송할 경우 안전한 전송 정책을 수립하고 조직 간 합의를 통해 관리 책임, 전송방법, 개인정보 및 중요정보 보호를 위한 기술적 보호조치 등을 협약하고 이행하여야 한다."
    points:
      - { text: "타 조직에 개인정보·중요정보를 전송할 때의 안전한 전송 정책 수립", checks: [ops-transfer-policy] }
      - { text: "관리 책임, 전송방법, 기술적 보호조치 등 조직 간 협약과 이행", checks: [ops-transfer, cry-transit] }
  - id: "2.10.6"
    title: "업무용 단말기기 보안"
    group: "보호대책 요구사항"
    text: "PC, 모바일 기기 등 단말기기를 업무 목적으로 네트워크에 연결할 경우 기기 인증 및 승인, 접근 범위, 기기 보안설정 등의 접근통제 대책을 수립하고 주기적으로 점검하여야 한다."
    points:
      - { text: "업무용 단말기기 인증·승인과 접근 범위 통제", checks: [ops-device-approve] }
      - { text: "업무용 단말기기 보안설정", checks: [ops-endpoint, cry-endpoint] }
      - { text: "단말기기 접근통제 대책 주기적 점검", checks: [ops-device-audit] }
  - id: "2.10.7"
    title: "보조저장매체 관리"
    group: "보호대책 요구사항"
    text: "보조저장매체를 통하여 개인정보 또는 중요정보의 유출이 발생하거나 악성코드가 감염되지 않도록 관리 절차를 수립ㆍ이행하고, 개인정보 또는 중요정보가 포함된 보조저 장매체는 안전한 장소에 보관하여야 한다."
    points:
      - { text: "보조저장매체를 통한 유출·악성코드 감염 방지 관리 절차 수립·이행", checks: [ops-media] }
      - { text: "개인정보·중요정보가 포함된 보조저장매체를 안전한 장소에 보관", checks: [ops-media] }
  - id: "2.10.8"
    title: "패치관리"
    group: "보호대책 요구사항"
    text: "소프트웨어, 운영체제, 보안시스템 등의 취약점으로 인한 침해사고를 예방하기 위하여 최신 패치를 적용하여야 한다. 다만 서비스 영향을 검토하여 최신 패치 적용이 어려울 경우 별도의 보완대책을 마련하여 이행하여야 한다."
    points:
      - { text: "소프트웨어·운영체제·보안시스템 등에 최신 패치 적용", checks: [ops-patch] }
      - { text: "패치 적용이 어려울 경우 서비스 영향 검토와 보완대책 마련·이행", checks: [ops-patch-exception] }
  - id: "2.10.9"
    title: "악성코드 통제"
    group: "보호대책 요구사항"
    text: "바이러스ㆍ웜ㆍ트로이목마ㆍ랜섬웨어 등의 악성코드로부터 개인정보 및 중요정보, 정보시스템 및 업무용 단말기 등을 보호하기 위하여 악성코드 예방ㆍ탐지ㆍ대응 등의 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "악성코드 예방·탐지 보호대책 수립·이행", checks: [ops-malware] }
      - { text: "악성코드 감염 시 대응 보호대책 수립·이행", checks: [ops-malware-response] }
  - id: "2.11.1"
    title: "사고 예방 및 대응체계 구축"
    group: "보호대책 요구사항"
    text: "침해사고 및 개인정보 유출 등을 예방하고 사고 발생 시 신속하고 효과적으로 대응할 수 있도록 내ㆍ외부 침해시도의 탐지ㆍ대응ㆍ분석 및 공유를 위한 체계와 절차를 수립하고, 관련 외부기관 및 전문가들과 협조체계를 구축하여야 한다."
    points:
      - { text: "침해시도 탐지·대응·분석·공유 체계와 절차 수립", checks: [inc-plan, inc-possible] }
      - { text: "관련 외부기관·전문가와 협조체계 구축", checks: [inc-contacts] }
  - id: "2.11.2"
    title: "취약점 점검 및 조치"
    group: "보호대책 요구사항"
    text: "정보시스템의 취약점이 노출되어 있는지를 확인하기 위하여 정기적으로 취약점 점검을 수행하고 발견된 취약점에 대해서는 신속하게 조치하여야 한다. 또한 최신 보안취약점의 발생 여부를 지속적으로 파악하고 정보시스템에 미치는 영향을 분석하여 조치하여야 한다."
    points:
      - { text: "정기적 취약점 점검 수행", checks: [inc-vuln, inc-public-pentest] }
      - { text: "발견된 취약점 신속 조치", checks: [inc-vuln-fix] }
      - { text: "최신 보안취약점 발생 여부 파악과 영향 분석·조치", checks: [inc-vuln-intel] }
  - id: "2.11.3"
    title: "이상행위 분석 및 모니터링"
    group: "보호대책 요구사항"
    text: "내ㆍ외부에 의한 침해시도, 개인정보유출 시도, 부정행위 등을 신속하게 탐지ㆍ대응할 수 있도록 네트워크 및 데이터 흐름 등을 수집하여 분석하며, 모니터링 및 점검 결과에 따른 사후조치는 적시에 이루어져야 한다."
    points:
      - { text: "네트워크·데이터 흐름 등을 수집·분석해 침해시도·유출시도·부정행위 탐지·대응", checks: [inc-monitor, net-detect, pub-log] }
      - { text: "모니터링·점검 결과에 따른 사후조치를 적시에 이행", checks: [inc-monitor-followup] }
  - id: "2.11.4"
    title: "사고 대응 훈련 및 개선"
    group: "보호대책 요구사항"
    text: "침해사고 및 개인정보 유출사고 대응 절차를 임직원과 이 해관계자가 숙지하도록 시나리오에 따른 모의훈련을 연 1회 이상 실시하고 훈련결과를 반영하여 대응체계를 개선하여야 한다."
    points:
      - { text: "임직원·이해관계자 대상 시나리오 모의훈련 연 1회 이상 실시", checks: [inc-drill] }
      - { text: "훈련결과를 반영해 대응체계 개선", checks: [inc-drill-improve] }
  - id: "2.11.5"
    title: "사고 대응 및 복구"
    group: "보호대책 요구사항"
    text: "침해사고 및 개인정보 유출 징후나 발생을 인지한 때에는 법적 통지 및 신고 의무를 준수하여야 하며, 절차에 따라 신속하게 대응 및 복구하고 사고분석 후 재발방지 대책을 수립하여 대응체계에 반영하여야 한다."
    points:
      - { text: "사고 징후·발생 인지 시 법적 통지·신고 의무 준수", checks: [inc-notify, inc-possible, inc-notify-hours, inc-report-hours] }
      - { text: "절차에 따라 신속하게 대응·복구", checks: [inc-respond] }
      - { text: "사고분석 후 재발방지 대책 수립과 대응체계 반영", checks: [inc-postmortem] }
  - id: "2.12.1"
    title: "재해·재난 대비 안전조치"
    group: "보호대책 요구사항"
    text: "자연재해, 통신ㆍ전력 장애, 해킹 등 조직의 핵심 서비스 및 시스템의 운영 연속성을 위협할 수 있는 재해 유형을 식별하고 유형별 예상 피해규모 및 영향을 분석하여야 한다. 또한 복구 목표시간, 복구 목표시점을 정의하고 복구 전략 및 대책, 비상시 복구 조직, 비상연락체계, 복구 절차 등 재해 복구체계를 구축하여야 한다."
    points:
      - { text: "재해 유형 식별과 유형별 예상 피해규모·영향 분석", checks: [dr-bia] }
      - { text: "복구 목표시간(RTO)과 복구 목표시점(RPO) 정의", checks: [dr-rto] }
      - { text: "복구 전략·대책, 비상 복구 조직, 비상연락체계, 복구 절차 등 재해 복구체계 구축", checks: [dr-plan, dr-team] }
  - id: "2.12.2"
    title: "재해 복구 시험 및 개선"
    group: "보호대책 요구사항"
    text: "재해 복구 전략 및 대책의 적정성을 정기적으로 시험하여 시험결과, 정보시스템 환경변화, 법규 등에 따른 변화를 반영하여 복구전략 및 대책을 보완하여야 한다."
    points:
      - { text: "재해 복구 전략·대책의 적정성 정기 시험", checks: [dr-test] }
      - { text: "시험결과·환경변화·법규 변화를 반영해 복구전략·대책 보완", checks: [dr-update] }
  - id: "3.1.1"
    title: "개인정보 수집·이용"
    group: "개인정보 처리 단계별 요구사항"
    text: "개인정보는 적법하고 정당하게 수집ㆍ이용하여야 하며, 정보주체의 동의를 근거로 수집하는 경우에는 적법한 방법으로 정보주체의 동의를 받아야 한다. 또한 만 14세 미만 아동의 개인정보를 수집하는 경우에는 그 법정대리인의 동의를 받아야 하며 법정대리인이 동의하였는지를 확인하여야 한다."
    points:
      - { text: "개인정보를 적법하고 정당하게 수집·이용", checks: [prv-basis, prv-nonconsent-disclose] }
      - { text: "동의를 근거로 수집 시 적법한 방법으로 동의 획득", checks: [prv-consent, prv-consent-notice, prv-consent-highlight, prv-consent-free] }
      - { text: "만 14세 미만 아동은 법정대리인 동의를 받고 동의 여부 확인", checks: [prv-children, prv-children-min, prv-children-notice] }
  - id: "3.1.2"
    title: "개인정보 수집 제한"
    group: "개인정보 처리 단계별 요구사항"
    text: "개인정보를 수집하는 경우 처리 목적에 필요한 최소한의 개인정보만을 수집하여야 하며, 정보주체가 선택적으로 동의할 수 있는 사항 등에 동의하지 아니한다는 이유로 정보주체에게 재화 또는 서비스의 제공을 거부하지 않아야 한다."
    points:
      - { text: "처리 목적에 필요한 최소한의 개인정보만 수집", checks: [prv-minimum, prv-optional-notice] }
      - { text: "선택 사항 등에 동의하지 않았다는 이유로 재화·서비스 제공 거부 금지", checks: [prv-minimum] }
  - id: "3.1.3"
    title: "주민등록번호 처리 제한"
    group: "개인정보 처리 단계별 요구사항"
    text: "주민등록번호는 법적 근거가 있는 경우를 제외하고는 수집ㆍ이용 등 처리할 수 없으며, 주민등록번호의 처리가 허용된 경우라 하더라도 인터넷 홈페이지 등에서 대체수단을 제공하여야 한다."
    points:
      - { text: "법적 근거가 있는 경우를 제외하고 주민등록번호 처리 금지", checks: [prv-rrn] }
      - { text: "처리가 허용된 경우에도 인터넷 홈페이지 등에서 대체수단 제공", checks: [prv-rrn-alt] }
  - id: "3.1.4"
    title: "민감정보 및 고유식별정보의 처리 제한"
    group: "개인정보 처리 단계별 요구사항"
    text: "민감정보와 고유식별정보(주민등록번호 제외)를 처리하기 위해서는 법령에서 구체적으로 처리를 요구하거나 허용하는 경우를 제외하고는 정보주체의 별도 동의를 받아야 한다."
    points:
      - { text: "민감정보는 법령 근거가 없으면 별도 동의를 받아 처리", checks: [prv-sensitive, prv-sensitive-sep, prv-sensitive-public] }
      - { text: "고유식별정보(주민등록번호 제외)는 법령 근거가 없으면 별도 동의를 받아 처리", checks: [prv-sensitive, prv-unique-sep] }
  - id: "3.1.5"
    title: "개인정보 간접수집"
    group: "개인정보 처리 단계별 요구사항"
    text: "정보주체 이외로부터 개인정보를 수집하거나 제3자로부터 제공받는 경우에는 업무에 필요한 최소한의 개인정보를 수집하거나 제공받아야 하며, 법령에 근거하거나 정보주체의 요구가 있으면 개인정보의 수집 출처, 처리목적, 처리정지의 요구권리를 알려야 한다."
    points:
      - { text: "정보주체 외로부터 수집하거나 제공받는 개인정보를 업무상 필요한 최소한으로 제한", checks: [prv-indirect-min] }
      - { text: "법령 근거나 정보주체 요구가 있으면 수집 출처·처리목적·처리정지 요구권리 고지", checks: [prv-indirect, prv-indirect-days, prv-indirect-record] }
  - id: "3.1.6"
    title: "영상정보처리기기 설치·운영"
    group: "개인정보 처리 단계별 요구사항"
    text: "고정형 영상정보처리기기를 공개된 장소에 설치ㆍ운영하거나 이동형 영상정보처리기기를 공개된 장소에서 업무를 목적으로 운영하는 경우 설치 목적 및 위치에 따라 법적 요구사항을 준수하고, 적절한 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "영상정보처리기기 설치 목적·위치에 따른 법적 요구사항 준수", checks: [prv-cctv, prv-mobilecam, prv-cctv-private, prv-cctv-hearing, prv-cctv-sign, prv-cctv-noaudio, prv-cctv-policy, prv-mobilecam-sign] }
      - { text: "영상정보 보호대책 수립·이행", checks: [prv-cctv-secure] }
  - id: "3.1.7"
    title: "마케팅 목적의 개인정보 수집·이용"
    group: "개인정보 처리 단계별 요구사항"
    text: "재화나 서비스의 홍보, 판매 권유, 광고성 정보전송 등 마케팅 목적으로 개인정보를 수집ㆍ이용하는 경우 그 목적을 정보주체가 명확하게 인지할 수 있도록 고지하고 동의를 받아야 한다."
    points:
      - { text: "마케팅 목적을 정보주체가 명확하게 인지할 수 있도록 고지", checks: [prv-marketing-notice] }
      - { text: "마케팅 목적 수집·이용에 대한 동의 획득", checks: [prv-marketing] }
  - id: "3.2.1"
    title: "개인정보 현황관리"
    group: "개인정보 처리 단계별 요구사항"
    text: "수집ㆍ보유하는 개인정보의 항목, 보유량, 처리 목적 및 방법, 보유기간 등 현황을 정기적으로 관리하여야 하며, 공공기관의 경우 이를 법률에서 정한 관계기관의 장에게 등록하여야 한다."
    points:
      - { text: "개인정보 항목·보유량·처리 목적·방법·보유기간 등 현황 정기 관리", checks: [prv-inventory, gov-flow] }
      - { text: "공공기관은 법률에서 정한 관계기관의 장에게 등록", checks: [gov-file-register] }
  - id: "3.2.2"
    title: "개인정보 품질보장"
    group: "개인정보 처리 단계별 요구사항"
    text: "수집된 개인정보는 처리 목적에 필요한 범위에서 개인정보의 정확성ㆍ완전성ㆍ최신성이 보장되도록 정보주체에게 관리절차를 제공하여야 한다."
    points:
      - { text: "정확성·완전성·최신성 보장을 위한 관리절차를 정보주체에게 제공", checks: [prv-quality] }
  - id: "3.2.3"
    title: "이용자 단말기 접근 보호"
    group: "개인정보 처리 단계별 요구사항"
    text: "정보주체(이용자)의 이동통신단말장치 내에 저장되어 있는 정보 및 이동통신단말장치에 설치된 기능에 접근이 필요한 경우 이를 명확하게 인지할 수 있도록 알리고 정보 주체(이용자)의 동의를 받아야 한다."
    points:
      - { text: "이동통신단말장치 내 정보·기능 접근 시 명확히 알리고 동의 획득", checks: [prv-device] }
  - id: "3.2.4"
    title: "개인정보 목적 외 이용 및 제공"
    group: "개인정보 처리 단계별 요구사항"
    text: "개인정보는 수집 시의 정보주체에게 고지ㆍ동의를 받은 목적 또는 법령에 근거한 범위 내에서만 이용 또는 제공하여야 하며, 이를 초과하여 이용ㆍ제공하려는 때에는 정보주체의 추가 동의를 받거나 관계 법령에 따른 적법한 경우인지 확인하고 적절한 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "고지·동의 받은 목적 또는 법령 근거 범위 내에서만 이용·제공", checks: [prv-purpose, prv-received] }
      - { text: "목적을 초과할 때 추가 동의를 받거나 법령상 적법한 경우인지 확인", checks: [prv-purpose, prv-additional-use, prv-purpose-notice] }
      - { text: "목적 외 이용·제공 시 보호대책 수립·이행", checks: [prv-purpose-protect] }
  - id: "3.2.5"
    title: "가명정보 처리"
    group: "개인정보 처리 단계별 요구사항"
    text: "가명정보를 처리하는 경우 목적제한, 결합제한, 안전조치, 금지의무 등 법적 요건을 준수하고 적정 수준의 가명 처리를 보장할 수 있도록 가명처리 절차를 수립ㆍ이행하여야 한다."
    points:
      - { text: "목적제한·결합제한·안전조치·금지의무 등 가명정보 법적 요건 준수", checks: [prv-pseudonym, prv-combine, prv-pseudo-purpose, prv-pseudo-provide, prv-combine-export, prv-pseudo-access, prv-pseudo-record, prv-pseudo-record-years, prv-pseudo-reid] }
      - { text: "적정 수준의 가명처리를 보장하는 절차 수립·이행", checks: [prv-pseudo-proc] }
  - id: "3.3.1"
    title: "개인정보 제3자 제공"
    group: "개인정보 처리 단계별 요구사항"
    text: "개인정보를 제3자에게 제공하는 경우 법적 근거에 의하거나 정보주체의 동의를 받아야 하며, 제3자에게 개인정보의 접근을 허용하는 등 제공 과정에서 개인정보를 안전하게 보호하기 위한 보호대책을 수립ㆍ이행하여야 한다."
    points:
      - { text: "법적 근거 또는 정보주체 동의에 따른 제3자 제공", checks: [prv-third, prv-third-notice] }
      - { text: "접근 허용 등 제공 과정에서의 보호대책 수립·이행", checks: [prv-third-secure] }
  - id: "3.3.2"
    title: "업무 위탁에 따른 정보주체 고지"
    group: "개인정보 처리 단계별 요구사항"
    text: "개인정보 처리업무를 제3자에게 위탁하는 경우 위탁하는 업무의 내용과 수탁자 등 관련사항을 공개하여야 한다. 또한 재화 또는 서비스를 홍보하거나 판매를 권유하는 업무를 위탁하는 경우 위탁하는 업무의 내용과 수탁자를 정보주체에게 알려야 한다."
    points:
      - { text: "위탁 업무 내용과 수탁자 등 관련사항 공개", checks: [prv-outsource-public] }
      - { text: "홍보·판매 권유 업무 위탁 시 업무 내용과 수탁자를 정보주체에게 통지", checks: [prv-outsource-notify] }
  - id: "3.3.3"
    title: "영업의 양수 등에 따른 개인정보의 이전"
    group: "개인정보 처리 단계별 요구사항"
    text: "영업의 양도ㆍ합병 등으로 개인정보를 이전하거나 이전받는 경우 정보주체 통지 등 적절한 보호조치를 수립ㆍ이행하여야 한다."
    points:
      - { text: "영업 양도·합병 등으로 개인정보를 이전하거나 이전받을 때 정보주체 통지 등 보호조치", checks: [prv-transfer, prv-transfer-receive, prv-transfer-purpose] }
  - id: "3.3.4"
    title: "개인정보의 국외 이전"
    group: "개인정보 처리 단계별 요구사항"
    text: "개인정보를 국외로 이전하는 경우 국외 이전에 대한 동의, 관련 사항에 대한 공개 등 적절한 보호조치를 수립ㆍ이행하여야 한다."
    points:
      - { text: "국외 이전에 대한 동의 등 적법 근거와 보호조치", checks: [prv-overseas, prv-overseas-consent, prv-overseas-protect] }
      - { text: "국외 이전 관련 사항 공개", checks: [prv-overseas-disclose] }
  - id: "3.4.1"
    title: "개인정보의 파기"
    group: "개인정보 처리 단계별 요구사항"
    text: "개인정보의 보유기간 및 파기 관련 내부 정책을 수립하고 개인정보의 보유기간 경과, 처리목적 달성 등 파기 시점이 도달한 때에는 파기의 안전성 및 완전성이 보장될 수 있는 방법으로 지체 없이 파기하여야 한다."
    points:
      - { text: "개인정보 보유기간과 파기 관련 내부 정책 수립", checks: [prv-retention-policy] }
      - { text: "파기 시점 도달 시 안전성·완전성이 보장되는 방법으로 지체 없이 파기", checks: [prv-destroy, prv-destroy-partial] }
  - id: "3.4.2"
    title: "처리목적 달성 후 보유 시 조치"
    group: "개인정보 처리 단계별 요구사항"
    text: "개인정보의 보유기간 경과 또는 처리목적 달성 후에도 관련 법령 등에 따라 파기하지 아니하고 보존하는 경우에는 해당 목적에 필요한 최소한의 항목으로 제한하고 다른 개인정보와 분리하여 저장ㆍ관리하여야 한다."
    points:
      - { text: "법령에 따라 보존하는 개인정보를 필요한 최소한의 항목으로 제한", checks: [prv-retain-min] }
      - { text: "보존하는 개인정보를 다른 개인정보와 분리해 저장·관리", checks: [prv-retain] }
  - id: "3.5.1"
    title: "개인정보처리방침 공개"
    group: "개인정보 처리 단계별 요구사항"
    text: "개인정보의 처리 목적 등 필요한 사항을 모두 포함하여 정보주체가 알기 쉽도록 개인정보 처리방침을 수립하고, 이를 정보주체가 언제든지 쉽게 확인할 수 있도록 적절한 방법에 따라 공개하고 지속적으로 현행화하여야 한다."
    points:
      - { text: "처리 목적 등 필요한 사항을 모두 포함한 개인정보 처리방침 수립", checks: [prv-policy] }
      - { text: "정보주체가 알기 쉽게 작성하고 언제든지 쉽게 확인할 수 있도록 공개", checks: [prv-policy-easy] }
      - { text: "처리방침 지속 현행화", checks: [prv-policy-update] }
  - id: "3.5.2"
    title: "정보주체 권리보장"
    group: "개인정보 처리 단계별 요구사항"
    text: "정보주체가 개인정보의 열람, 정정ㆍ삭제, 처리정지, 이의제기, 동의철회 등 요구를 수집 방법ㆍ절차보다 쉽게 할 수 있도록 권리행사 방법 및 절차를 수립ㆍ이행하고, 정보주체의 요구를 받은 경우 지체 없이 처리하고 관련기록을 남겨야 한다. 또한 정보주체의 사생활 침해, 명예훼손 등 타인의 권리를 침해하는 정보가 유통되지 않도록 삭제 요청, 임시조치 등의 기준을 수립ㆍ이행하여야 한다."
    points:
      - { text: "열람·정정·삭제·처리정지·이의제기·동의철회 등을 수집보다 쉽게 할 수 있는 권리행사 방법·절차 수립·이행", checks: [prv-rights, prv-auto, prv-portability, prv-rights-refuse, prv-auto-disclose, prv-rights-agent, prv-rights-fee] }
      - { text: "정보주체 요구를 지체 없이 처리", checks: [prv-rights-days, prv-request-days, prv-erase-request, prv-correct-source, prv-withdraw, prv-auto-days] }
      - { text: "권리행사 처리 관련 기록 보관", checks: [prv-rights-log] }
      - { text: "타인의 권리를 침해하는 정보 유통 방지를 위한 삭제 요청·임시조치 기준 수립·이행", checks: [prv-takedown] }
