# 점검에 연결하지 않은 조문의 역할. 점검에 연결된 조문은 자동으로 "check"가 됩니다.
# situational: 특정 사건·상황이 생기면 적용되는 조문. always: 어떤 상황이든 먼저 볼 조문. reference: 직접 점검할 의무가 아닌 조문(이유별).
always:
  제2조: 용어에 해당하는지부터 확인(개인정보·처리·개인정보처리자)
  제4조: 정보주체의 권리
  제6조: 다른 법률에 특별한 규정이 있는지 확인
  제58조: 법 적용이 일부 제외되는 경우인지 확인
  제58조의2: 더 이상 개인을 알아볼 수 없는 정보인지 확인
  기준 제2조: 안전성 확보조치 기준의 용어
  기준 제3조: 보유 수·유형·영향에 맞게 안전조치를 적용하는 원칙
