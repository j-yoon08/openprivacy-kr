domain: 인적·외부자·물리 보안
checks:
  - id: ppl-key
    need: 개인정보취급자 등 주요 직무자를 최소한으로 지정해 최신 목록으로 관리한다
    legal: true
    severity: med
    effort: S
    fix: [대량 개인정보·관리자 권한 보유자를 주요 직무로 정의합니다., 지정 목록을 분기마다 검토해 불필요한 지정을 해제합니다.]
    evidence: [주요 직무자·개인정보취급자 목록]
    map: { pipa: [제28조], ismsp: [2.2.1], iso: [A.6.1, A.6.2] }
  - id: ppl-sod
    need: 개발·운영·감사 등 상충 직무를 분리하고, 어렵다면 상호 검토 등 보완통제를 둔다
    severity: med
    effort: M
    fix: [상충 직무표를 만들고 현재 겸직을 확인합니다., 분리가 어려우면 로그 검토·상위 승인 등 보완통제를 문서화합니다.]
    evidence: [직무분리 기준, 보완통제 수행 기록]
    map: { ismsp: [2.2.2], iso: [A.5.3] }
  - id: ppl-nda
    need: 임직원·외부자에게 채용·계약·퇴직 시 비밀유지 및 보안 서약을 받는다
    severity: med
    effort: S
    fix: [신규·퇴직·외부자용 서약서를 구분해 만듭니다., 채용 전 결격·경력 확인과 고용 조건의 보안 의무를 포함합니다., 서약서 누락자를 점검합니다.]
    evidence: [보안 서약서, 서약 현황]
    map: { ismsp: [2.2.3], iso: [A.6.1, A.6.2, A.6.6] }
  - id: ppl-training
    need: CPO와 개인정보취급자에게 차등화한 교육을 정기적으로 하고 전 임직원 보안 교육을 연 1회 이상 한다
    legal: true
    severity: high
    effort: M
    fix: [교육 목적·대상·내용·일정·방법을 담은 연간 계획을 승인받습니다., 취급자·개발자·관리자별 심화 과정을 분리합니다., 미이수자 추가 교육과 이해도 평가를 합니다.]
    evidence: [연간 교육계획, 교육 자료·이수 명단, 평가 결과]
    map: { pipa: [제28조, 기준 제4조], ismsp: [2.2.4], iso: ["7.2", "7.3", A.6.3] }
  - id: ppl-leave
    need: 퇴직·직무변경 시 자산 반납, 계정·권한 회수를 지체 없이 하고 결과를 확인한다
    legal: true
    severity: high
    effort: S
    fix: [인사 이벤트를 계정·권한 회수 절차와 연동합니다., 퇴직 체크리스트(자산·출입증·SaaS·공용계정 비밀번호 변경)를 사용합니다., 퇴직자 명단과 활성 계정을 월 1회 대조합니다.]
    evidence: [퇴직 체크리스트, 권한 회수 기록]
    map: { pipa: [기준 제5조], ismsp: [2.2.5], iso: [A.5.11, A.6.5] }
  - id: ppl-discipline
    need: 보안·개인정보 규정 위반 시 조치 기준과 절차를 정해 실제로 적용한다
    severity: low
    effort: S
    fix: [인사규정에 위반 유형별 조치를 반영합니다., 위반 처리 결과를 재발방지 교육에 반영합니다.]
    evidence: [징계 규정, 위반 처리 기록]
    map: { ismsp: [2.2.6], iso: [A.6.4] }
  - id: sup-inventory
    need: 외부 위탁·서비스·공급망 현황과 위험을 식별해 목록으로 관리한다
    when: { any: [{ ref: externalParties }, { fact: cloud, is: true }] }
    severity: med
    effort: S
    fix: [위탁사·SaaS·클라우드·유지보수사를 목록으로 만듭니다., "접근하는 자산과 개인정보, 재위탁 여부를 적습니다.", 공급망 위험을 평가해 등급을 정합니다.]
    evidence: [외부자·수탁자 현황표, 공급자 위험평가]
    map: { ismsp: [2.3.1], iso: [A.5.19, A.5.21] }
  - id: sup-contract
    need: 위탁 계약서에 법정 사항(목적 외 처리 금지, 안전조치, 재위탁 제한, 감독, 손해배상 등)을 담는다
    when: { ref: externalParties }
    legal: { fact: outsourcing, is: true }
    severity: high
    effort: M
    fix: [법 제26조①과 시행령 제28조① 사항을 담은 표준 위·수탁 계약서를 만듭니다., 기존 계약의 누락 조항을 부속합의로 보완합니다., 개발 위탁은 보안 요구·소스 귀속·점검 조항을 추가합니다.]
    evidence: [위·수탁 계약서, 계약 점검표]
    map: { pipa: [제26조], ismsp: [2.3.2], iso: [A.5.20] }
  - id: sup-monitor
    need: 수탁자를 교육하고 처리 현황을 주기적으로 점검·감독하며 미흡사항을 개선시킨다
    when: { ref: externalParties }
    legal: { fact: outsourcing, is: true }
    severity: high
    effort: M
    fix: [수탁자 위험도별 점검 주기와 방법(서면·현장)을 정합니다., 교육 자료를 제공하고 이수 증빙을 받습니다., 재위탁은 사전 동의를 받고 점검 결과 개선을 추적합니다.]
    evidence: [수탁자 점검 결과, 수탁자 교육 증빙, 재위탁 동의서]
    map: { pipa: [제26조], ismsp: [2.3.3], iso: [A.5.22] }
  - id: sup-end
    need: 외부자 계약 만료·변경 시 자산 반납, 계정 삭제, 개인정보 파기를 확인한다
    when: { ref: externalParties }
    severity: med
    effort: S
    fix: [종료 체크리스트를 계약에 붙입니다., 파기 확인서와 계정 삭제 기록을 받습니다.]
    evidence: [개인정보 파기 확인서, 계약 종료 체크리스트]
    map: { ismsp: [2.3.4], iso: [A.5.11, A.5.20] }
  - id: phy-zone
    need: 보호구역을 등급별로 지정하고 물리적 경계와 감시 대책을 둔다
    severity: med
    effort: M
    fix: [통제·제한·접견 구역을 도면에 지정합니다., 구역별 출입 자격·감시 대책을 정합니다.]
    evidence: [보호구역 지정 문서·도면]
    map: { ismsp: [2.4.1], iso: [A.7.1, A.7.3, A.7.4] }
  - id: phy-access
    need: 개인정보 보관 장소와 보호구역의 출입을 인가자로 제한하고 출입기록을 주기적으로 점검한다
    legal: { fact: serverRoom, is: true }
    severity: med
    effort: S
    fix: [출입 신청·승인·회수 절차를 정합니다., 출입 로그를 보존하고 월 1회 이상 이상 출입을 확인합니다., 클라우드만 쓰면 사업자의 물리 통제 인증서를 확보합니다.]
    evidence: [출입 권한 목록, 출입기록 점검 결과, 클라우드 사업자 인증서]
    map: { pipa: [기준 제10조], ismsp: [2.4.2], iso: [A.7.2] }
  - id: phy-equip
    need: 시스템을 중요도에 따라 안전하게 배치하고 전력·통신 케이블을 손상에서 보호한다
    when: { fact: serverRoom, is: true }
    severity: low
    effort: M
    fix: [장비 배치도를 관리하고 잠금 랙을 사용합니다., 전원·통신 배선을 분리하고 표시합니다.]
    evidence: [장비 배치도, 전산실 점검 기록]
    map: { ismsp: [2.4.3], iso: [A.7.8, A.7.12] }
  - id: phy-facility
    need: 화재·누수·전력 이상에 대비한 보호설비를 갖추고 정기 점검한다
    when: { fact: serverRoom, is: true }
    severity: med
    effort: L
    fix: [항온항습·소화·누수감지·UPS를 갖춥니다., 유지보수 계약과 정기 점검 기록을 남깁니다., IDC 이용 시 계약에 보호설비 요건을 넣습니다.]
    evidence: [설비 점검 기록, IDC 계약서]
    map: { ismsp: [2.4.4], iso: [A.7.5, A.7.11, A.7.13] }
  - id: phy-work
    need: 보호구역 내 작업을 사전 승인하고 작업 기록을 검토한다
    when: { fact: serverRoom, is: true }
    severity: low
    effort: S
    fix: [작업 신청서와 입회 기준을 정합니다., 출입기록과 작업기록을 대조합니다.]
    evidence: [보호구역 작업 신청·기록]
    map: { ismsp: [2.4.5], iso: [A.7.6] }
  - id: phy-media-inout
    need: 단말·저장매체의 반출입을 승인·기록하고 무단 반출을 통제한다
    legal: true
    severity: med
    effort: S
    fix: [반출입 대상과 승인 절차를 정합니다., 반출입 대장을 주기적으로 점검합니다., 사외 사용 장비의 암호화·분실 신고 기준을 정합니다.]
    evidence: [반출입 관리대장]
    map: { pipa: [기준 제10조], ismsp: [2.4.6], iso: [A.7.9, A.7.10] }
  - id: phy-office
    need: 사무실에서 클린데스크·화면잠금을 적용하고 개인정보 서류를 잠금 보관하며 공용기기를 보호한다
    legal: true
    severity: med
    effort: S
    fix: [개인정보 서류·매체를 잠금장치가 있는 곳에 둡니다., 화면보호기 자동 잠금과 복합기 보안 출력을 적용합니다., 클린데스크 점검을 정기 실시합니다.]
    evidence: [클린데스크 점검 결과, 잠금 보관 사진]
    map: { pipa: [기준 제10조, 기준 제12조], ismsp: [2.4.7], iso: [A.7.3, A.7.7] }
