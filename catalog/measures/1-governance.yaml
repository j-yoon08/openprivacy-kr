domain: 관리체계·거버넌스
checks:
  - id: gov-ceo
    need: 대표자·경영진이 보호 활동을 정기적으로 보고받고 의사결정하며, 인력과 예산을 실제로 배정한다
    legal: true
    severity: high
    effort: M
    fix: [보고 주기(예. 분기)와 보고·승인 대상 안건을 정책에 명시합니다., 올해 보호 예산과 전담 인력을 품의·이사회 자료로 확정합니다., 대표자가 승인한 회의록과 지시 이행 결과를 남깁니다.]
    evidence: [경영진 보고서·회의록, 정보보호 예산 품의와 집행 내역]
    map: { pipa: [제30조의3], ismsp: [1.1.1, 1.1.6], iso: ["5.1", "7.1", A.5.4] }
  - id: gov-cpo
    need: 법정 요건에 맞는 개인정보 보호책임자(CPO)를 공식 지정하고 독립적인 업무 수행을 보장한다
    when: { not: { fact: sizeClass, in: [micro] } }
    legal: true
    severity: high
    effort: S
    fix: [사업주·대표자 또는 임원을 인사발령으로 지정합니다(공공기관은 시행령 제32조②1의 직급)., 법 제31조④의 업무를 직무기술서에 반영합니다., 대표자·이사회에 직접 보고하는 경로를 둡니다.]
    evidence: [CPO 임명 문서, CPO 직무기술서]
    map: { pipa: [제31조], ismsp: [1.1.2], iso: ["5.3", A.5.2, A.5.34] }
  - id: gov-cpo-report
    need: CPO 지정·변경·해제 시 이사회 의결을 거치고 6개월 이내에 보호위원회에 신고한다
    when: { ref: cpoReport }
    legal: true
    severity: high
    effort: M
    fix: [현재 CPO가 시행령 별표 1 자격을 충족하는지 확인합니다., 이사회 안건으로 상정해 의결합니다(법인)., 고시 서식으로 사유 발생일부터 6개월 이내에 신고합니다.]
    evidence: [이사회 의사록, CPO 신고 접수증, 자격 증빙]
    map: { pipa: [제31조], ismsp: [1.1.2], iso: [A.5.31] }
  - id: gov-ciso
    need: 정보보호 최고책임자(CISO)를 임원급으로 지정하고, 신고 대상이면 신고했다
    severity: high
    effort: S
    fix: [CISO를 인사발령으로 지정하고 자격 요건을 확인합니다., 정보통신망법 시행령 제36조의7로 신고·겸직금지 대상인지 판정합니다., 대상이면 신고하고 접수증을 보관합니다.]
    evidence: [CISO 임명 문서, CISO 신고 접수증]
    map: { ismsp: [1.1.2], iso: ["5.3", A.5.2] }
  - id: gov-org
    need: 보호 실무조직, 위원회, 부서별 담당자 협의체를 구성해 운영하고 역할·책임과 평가 체계를 둔다
    severity: med
    effort: M
    fix: [조직도와 역할·책임표(RACI)를 만듭니다., 위원회 규정과 정기 개최 일정을 정합니다., 활동을 평가할 지표(KPI)를 정하고 연 1회 평가합니다., KISA·보호위원회·수사기관 연락망과 외부 전문가 교류 채널을 정리합니다.]
    evidence: [조직도·역할책임표, 위원회 회의록, 비상 연락망]
    map: { ismsp: [1.1.3, 2.1.2], iso: ["5.3", "7.4", A.5.2, A.5.5, A.5.6] }
  - id: gov-scope
    need: 핵심 서비스와 개인정보 처리 흐름을 빠짐없이 포함하도록 관리체계 범위를 문서로 정했다
    severity: high
    effort: M
    fix: [서비스·조직·시스템·장소·외부 연계를 목록으로 만듭니다., 내부·외부 현안과 이해관계자 요구(기후변화 관련성 검토 포함)를 정리합니다., 제외 항목과 사유를 적고 경영진 승인을 받습니다.]
    evidence: [적용범위 문서, 네트워크·시스템 구성도, 이해관계자 요구사항 목록]
    map: { ismsp: [1.1.4], iso: ["4.1", "4.2", "4.3", "4.4"] }
  - id: gov-policy
    need: 경영진이 승인한 정보보호·개인정보보호 정책과 시행문서를 제정해 최신본을 배포한다
    legal: { ref: internalPlanRequired }
    severity: high
    effort: M
    fix: [최상위 정책 → 지침 → 절차서 순으로 문서 체계를 만듭니다., CISO·CPO·CEO 승인과 공포 이력을 남깁니다., 임직원이 항상 최신본을 볼 수 있는 위치에 게시합니다.]
    evidence: [정책서와 승인 이력, 정책 공지 기록]
    map: { pipa: [제29조, 기준 제4조], ismsp: [1.1.5], iso: ["5.2", "7.5", A.5.1, A.5.37] }
  - id: gov-internal-plan
    need: 법정 18개 사항을 모두 담은 개인정보 내부 관리계획을 수립했고 변경 이력을 관리한다
    when: { ref: internalPlanRequired }
    legal: true
    severity: high
    effort: M
    fix: ["`doc internal-plan` 초안을 바탕으로 18개 항목을 채웁니다.", 출력·복사 시 안전조치(12호)와 파기(13호)가 포함됐는지 확인합니다., 내부 의사결정 절차로 승인하고 개정 이력표를 둡니다.]
    evidence: [내부 관리계획 승인본, 개정 이력]
    map: { pipa: [제29조, 기준 제4조], ismsp: [1.1.5], iso: [A.5.34] }
  - id: gov-internal-plan-review
    need: CPO가 내부 관리계획의 이행 실태를 점검하는 주기
    when: { ref: internalPlanRequired }
    legal: true
    severity: high
    effort: S
    type: number
    unit: 개월
    rules: [{ lte: 12, basis: "안전성 확보조치 기준 제4조④(연 1회 이상)" }]
    fix: [접근권한·접속기록·암호화를 포함한 점검표를 만듭니다., 12개월 이내 주기로 점검하고 CPO가 결과를 승인합니다., 미흡사항의 담당자·기한을 정해 완료까지 추적합니다.]
    evidence: [내부 관리계획 이행 점검 결과 보고서]
    map: { pipa: [기준 제4조], ismsp: [1.4.2], iso: ["9.1", A.5.36] }
  - id: gov-policy-review
    need: 정책과 시행문서를 정기(최소 연 1회) 및 법령·환경 변화 시 검토해 제·개정 이력을 관리한다
    severity: med
    effort: S
    fix: [문서 관리대장에 검토일·검토자·변경 내용을 기록합니다., 법 개정·조직 변경을 수시 검토 사유로 정합니다., 구버전을 회수하고 개정 사실을 공지합니다.]
    evidence: [문서 관리대장, 정책 검토 결과]
    map: { ismsp: [2.1.1], iso: ["6.3", "7.5", A.5.1] }
  - id: gov-asset
    need: 정보자산을 식별해 중요도를 평가하고 소유자·관리자를 지정하며 목록을 최신으로 유지한다
    severity: high
    effort: M
    fix: [서버·DB·SaaS·단말·문서까지 자산 목록을 만듭니다., 기밀성·무결성·가용성으로 등급을 매기고 책임자를 지정합니다., 등급별 취급·표시 기준을 정하고 분기 또는 반기마다 실사합니다.]
    evidence: [정보자산 목록, 자산 실사 결과, 정보 분류·취급 지침]
    map: { ismsp: [1.2.1, 2.1.3], iso: [A.5.9, A.5.10, A.5.12, A.5.13] }
  - id: gov-flow
    need: 서비스와 개인정보 처리 전 과정의 현황·흐름을 분석해 현황표와 흐름도로 관리한다
    severity: high
    effort: M
    fix: ["처리 흐름 화면에 업무별 수집·이용·제공·위탁·보관·파기를 등록합니다.", 업무 부서와 인터뷰해 실제 흐름과 맞는지 확인합니다., 서비스 변경 시와 연 1회 이상 갱신합니다.]
    evidence: [개인정보 처리 현황표, 개인정보 흐름도]
    map: { pipa: [제3조], ismsp: [1.2.2, 3.2.1], iso: [A.5.34] }
  - id: gov-risk-method
    need: 위험평가 방법, 수용 가능 수준, 수행 계획을 정하고 최소 연 1회 전 범위를 평가한다
    severity: high
    effort: M
    fix: [자산·위협·취약점 기준과 위험 산정식을 정합니다., 수용 가능한 위험 수준(DoA)을 경영진이 승인합니다., 관리·기술·물리·법적 영역을 모두 평가하고 결과를 보고합니다.]
    evidence: [위험관리 지침, 위험평가 보고서, DoA 승인 기록]
    map: { pipa: [기준 제4조], ismsp: [1.2.3], iso: ["6.1.1", "6.1.2", "8.2"] }
  - id: gov-risk-treat
    need: 위험별 처리 방안과 보호대책을 선정하고 담당자·기한·예산이 있는 이행계획을 경영진이 승인한다
    severity: high
    effort: M
    fix: [위험별로 감소·회피·전가·수용 중 하나를 정합니다., 이행계획을 만들고 수용 위험은 승인 근거를 남깁니다., "ISO 27001은 적용성 보고서(SoA)로 포함·제외 사유를 문서화합니다(`doc soa`)."]
    evidence: [위험처리 계획, 적용성 보고서(SoA), 위험 수용 승인]
    map: { ismsp: [1.2.4], iso: ["6.1.3", "8.3"] }
  - id: gov-objectives
    need: 측정 가능한 보안·개인정보 목표를 세우고 성과를 주기적으로 측정해 보고한다
    severity: med
    effort: S
    fix: [부서별로 측정 가능한 목표와 지표를 정합니다., 측정 방법·주기·담당자를 정합니다., 결과를 경영검토 자료로 사용합니다.]
    evidence: [보안 목표와 지표, 측정 결과]
    map: { iso: ["6.2", "9.1"] }
  - id: gov-implement
    need: 선정한 보호대책을 계획대로 구현하고 구현 결과를 경영진이 확인한다
    severity: med
    effort: M
    fix: [이행계획 대비 진척을 월 단위로 관리합니다., "완료 항목에 증적을 연결하고 운영명세서를 작성합니다(`doc ismsp-statement`).", 지연 항목의 사유와 새 기한을 승인받습니다.]
    evidence: [보호대책 이행 결과 보고, 운영명세서]
    map: { ismsp: [1.3.1], iso: ["8.1"] }
  - id: gov-share
    need: 보호대책을 실제 운영할 부서와 담당자를 정하고 내용을 공유·교육한다
    severity: low
    effort: S
    fix: [보호대책별 운영 부서·담당자를 명시합니다., 담당자에게 절차와 기록 방법을 교육합니다.]
    evidence: [보호대책별 담당자 목록, 공유·교육 기록]
    map: { ismsp: [1.3.2], iso: ["7.4"] }
  - id: gov-operation
    need: 주기적·상시 보호 활동을 운영현황표로 관리하고 수행 여부를 점검한다
    severity: med
    effort: S
    fix: [일·월·분기·연 단위 활동을 운영현황표로 만듭니다., 증적 만료일과 연결해 누락을 점검합니다., 경영진이 주기적으로 확인합니다.]
    evidence: [연간 운영현황표, 수행 점검 기록]
    map: { ismsp: [1.3.3], iso: ["8.1", A.5.37] }
  - id: gov-legal
    need: 적용 법령·계약 요구사항을 식별해 최신으로 유지하고 준수 여부를 연 1회 이상 검토한다
    severity: high
    effort: M
    fix: [적용 법령 목록과 개정 확인 담당자를 정합니다., "카탈로그의 변경 주시 항목(`sources`)을 검토 대상에 넣습니다.", 저작권·라이선스와 법정 보존기록도 검토 대상에 포함합니다.]
    evidence: [법령 준거성 검토서, 법령 목록, 라이선스 관리대장]
    map: { pipa: [제3조], ismsp: [1.4.1], iso: [A.5.31, A.5.32, A.5.33, A.5.34] }
  - id: gov-audit
    need: 독립성 있는 인력이 관리체계를 연 1회 이상 점검(내부감사)하고 결과를 경영진에 보고한다
    severity: high
    effort: M
    fix: [운영 부서와 독립된 점검팀(또는 외부 전문가)을 구성합니다., 기준 전체를 대상으로 점검 계획·체크리스트를 만듭니다., 감사 중 시스템 영향이 없도록 범위와 권한을 사전 협의합니다.]
    evidence: [내부감사 계획·결과 보고서, 감사자 자격 근거]
    map: { ismsp: [1.4.2], iso: ["9.2", A.5.35, A.5.36, A.8.34] }
  - id: gov-improve
    need: 발견한 문제의 근본 원인을 분석해 재발방지 대책을 시행하고 효과를 확인한다
    severity: med
    effort: M
    fix: [부적합별 원인·시정조치·기한·담당자를 관리대장에 적습니다., 시정 후 효과를 다시 확인합니다., 반복 결함은 지표로 관리합니다.]
    evidence: [시정조치 관리대장, 재발방지 효과 확인 기록]
    map: { ismsp: [1.4.3], iso: ["10.1", "10.2"] }
  - id: gov-mgmt-review
    need: 경영진이 계획된 주기로 관리체계 전반을 경영검토하고 개선 결정을 남긴다
    severity: med
    effort: S
    fix: [감사 결과·위험·목표 달성·이해관계자 의견을 검토 자료로 준비합니다., 회의에서 결정한 개선사항과 자원을 기록합니다.]
    evidence: [경영검토 회의록]
    map: { ismsp: [1.1.1], iso: ["9.3"] }
  - id: gov-insurance
    need: 손해배상책임 이행을 위한 보험·공제 가입 또는 준비금 적립을 했다
    when: { ref: insurance }
    legal: true
    severity: med
    effort: S
    fix: [시행령 별표 1의4로 최저가입금액을 확인합니다., 보험·공제 가입 또는 준비금 적립 후 증권을 보관합니다.]
    evidence: [보험증권 또는 준비금 적립 증빙]
    map: { pipa: [제39조의7], ismsp: [1.4.1], iso: [A.5.31] }
  - id: gov-pia
    need: 대상 개인정보파일에 개인정보 영향평가를 하고 개선사항을 이행한다
    when: { ref: isPublic }
    legal: { ref: sensitiveScale }
    severity: high
    effort: L
    fix: [시행령 제35조로 파일별 대상 여부를 판정합니다., 지정 평가기관에 의뢰하고 결과를 제출합니다., 개선계획 이행을 점검합니다.]
    evidence: [영향평가서, 개선 이행 점검 결과]
    map: { pipa: [제33조], ismsp: [2.8.1], iso: [A.5.34] }
  - id: gov-domestic-agent
    need: 국내대리인을 문서로 지정해 처리방침에 공개하고 연 1회 이상 교육과 업무 점검을 한다
    when: { ref: domesticAgent }
    legal: true
    severity: high
    effort: M
