domain: 암호·로그·운영 보안
checks:
  - id: cry-password
    need: 비밀번호를 복호화되지 않는 안전한 일방향 알고리즘(솔트 포함)으로 저장하고 인증정보를 암호화한다
    legal: true
    severity: high
    effort: M
    fix: [MD5·SHA-1 등 취약 해시와 평문 저장을 찾습니다., "Argon2id·bcrypt·PBKDF2 등으로 바꾸고 로그인 시 재해시합니다.", 생체인식정보 등 인증정보의 저장·전송 암호화를 확인합니다.]
    evidence: [암호화 적용 현황, 해시 설정 코드 검토]
    map: { pipa: [기준 제7조], ismsp: [2.5.4, 2.7.1], iso: [A.5.17, A.8.24] }
  - id: cry-store
    need: 주민등록·여권·운전면허·외국인등록번호, 카드·계좌번호, 생체인식정보를 안전한 알고리즘으로 암호화 저장한다
    when: { ref: encryptTarget }
    legal: true
    severity: high
    effort: L
    fix: [DB·파일·로그·백업에서 대상 정보를 찾습니다., "AES-256 등 안전한 알고리즘으로 저장 시 암호화합니다.", "이용자가 아닌 정보주체의 고유식별정보는 기준 제7조③ 구간별 요건을 적용합니다(주민등록번호는 내부망도 암호화)."]
    evidence: [암호화 대상·알고리즘 목록, DB 암호화 확인 캡처]
    map: { pipa: [제24조, 제24조의2, 기준 제7조], ismsp: [2.7.1], iso: [A.8.24] }
  - id: cry-transit
    need: 인터넷망 구간으로 개인정보·인증정보를 송수신할 때 안전한 알고리즘(TLS 1.2 이상 권장)으로 암호화한다
    legal: true
    severity: high
    effort: S
    fix: [모든 페이지·API·메일·파일전송 구간을 점검합니다., TLS 1.0/1.1을 끄고 HTTP를 HTTPS로 전환합니다., 인증서 만료 알림을 설정합니다.]
    evidence: [TLS 점검 결과, 전송구간 암호화 현황]
    map: { pipa: [기준 제7조], ismsp: [2.7.1, 2.10.5], iso: [A.5.14, A.8.24] }
  - id: cry-endpoint
    need: 개인정보를 업무용 PC·모바일·보조저장매체에 저장할 때 암호화한다
    legal: true
    severity: high
    effort: M
    fix: [PC 저장을 원칙 금지하고 예외를 승인합니다., 디스크·파일 암호화(BitLocker·FileVault·DRM)를 강제합니다., 개인정보 검색 도구로 잔존 파일을 찾습니다.]
    evidence: [단말 암호화 현황, 개인정보 파일 검색 결과]
    map: { pipa: [기준 제7조], ismsp: [2.7.1, 2.10.6], iso: [A.8.1] }
  - id: cry-key
    need: 암호키의 생성·이용·보관·배포·파기 절차를 수립하고 키 접근을 최소화한다
    legal: { ref: largeHolder }
    severity: med
    effort: M
    fix: [키 관리대장과 책임자를 정합니다., 소스·설정의 하드코딩 키를 KMS·비밀관리 서비스로 옮깁니다., 주기적 교체와 유출 시 폐기 절차를 시험합니다.]
    evidence: [암호키 관리 절차, KMS 권한 설정]
    map: { pipa: [기준 제7조], ismsp: [2.7.2], iso: [A.8.24] }
  - id: log-retention
    need: 개인정보처리시스템 접속기록 보관 기간
    legal: true
    severity: high
    effort: M
    type: number
    unit: 개월
    rules:
      - { when: { ref: logTwoYears }, gte: 24, basis: "안전성 확보조치 기준 제8조① 단서(2년 이상)" }
      - { gte: 12, basis: "안전성 확보조치 기준 제8조①(1년 이상)" }
    fix: [시스템별 로그 보관 기간과 저장 위치를 표로 만듭니다., 필요 기간 이상 보존되도록 중앙 저장소의 보존 정책을 설정합니다., 과거 기록을 실제로 조회해 확인합니다.]
    evidence: [로그 보존 정책 설정, 기간 최하단 로그 샘플]
    map: { pipa: [기준 제8조], ismsp: [2.9.4], iso: [A.8.15] }
  - id: log-fields
    need: 접속기록에 식별자·접속일시·접속지·처리한 정보주체·수행업무가 남고 위변조·도난을 막는다
    legal: true
    severity: high
    effort: M
    fix: [조회·다운로드를 포함한 접속기록 샘플로 항목 누락을 확인합니다., 정보주체 식별정보가 남도록 애플리케이션 로그를 보강합니다., 쓰기 전용·불변 저장소에 분리 보관합니다.]
    evidence: [접속기록 샘플, 로그 저장소 접근권한]
    map: { pipa: [기준 제8조], ismsp: [2.9.4], iso: [A.8.15] }
  - id: log-review
    need: 접속기록과 다운로드 점검의 주기·방법·사후조치를 내부 관리계획에 정하고 이행한다
    legal: true
    severity: high
    effort: M
    fix: [점검 주기·방법·사후조치절차를 내부 관리계획에 명시합니다., 비정상 시간·대량 조회·타인 계정 기준을 정합니다., 다운로드 사유를 확인하고 소명·조치를 기록합니다.]
    evidence: [접속기록 점검 보고서, 다운로드 사유 확인 기록]
    map: { pipa: [기준 제8조], ismsp: [2.9.5], iso: [A.8.15, A.8.16] }
  - id: log-time
    need: 시스템 시각을 표준 시각과 동기화하고 정상 동작을 점검한다
    severity: low
    effort: S
    fix: [NTP 서버를 지정하고 전체 자산에 적용합니다., 동기화 상태를 정기 점검합니다.]
    evidence: [NTP 설정·점검 기록]
    map: { ismsp: [2.9.6], iso: [A.8.17] }
  - id: ops-change
    need: 시스템·자산 변경을 영향 분석·승인·복구계획을 갖춰 관리한다
    severity: med
    effort: S
    fix: [변경 요청·영향 분석·승인·롤백을 티켓으로 관리합니다., 긴급 변경은 사후 승인 기준을 둡니다., 기준 구성(베이스라인)과 설치 소프트웨어를 통제합니다.]
    evidence: [변경관리 기록, 구성 기준]
    map: { ismsp: [2.9.1], iso: ["6.3", A.8.9, A.8.19, A.8.32] }
  - id: ops-capacity
    need: 성능·용량을 감시하고 장애 대응·원인분석 절차를 운영한다
    severity: med
    effort: S
    fix: [임계치·알림·담당자를 정합니다., 장애 보고와 재발방지 기록을 남깁니다.]
    evidence: [용량 모니터링, 장애 보고서]
    map: { ismsp: [2.9.2], iso: [A.8.6] }
  - id: ops-backup
    need: 백업 대상·주기·보관을 정하고 중요 백업을 분리 보관하며 복구 시험을 한다
    severity: high
    effort: M
    fix: [RPO에 맞춰 백업 주기를 정합니다., 랜섬웨어에 대비해 소산·불변 백업을 둡니다., 연 1회 이상 복구를 시험합니다.]
    evidence: [백업 설정, 복구 시험 결과]
    map: { ismsp: [2.9.3], iso: [A.8.13] }
  - id: ops-dispose
    need: 자산 재사용·폐기 시 정보를 복구 불가능하게 삭제하고 기록한다
    legal: true
    severity: med
    effort: S
    fix: ["소각·파쇄, 전용 소자장비, 초기화·덮어쓰기 중 방법을 정합니다.", 폐기 대장에 기기·방법·입회자를 적습니다., 위탁 폐기는 확인서를 받습니다.]
    evidence: [폐기 관리대장, 폐기 확인서]
    map: { pipa: [기준 제13조], ismsp: [2.9.7], iso: [A.7.14, A.8.10] }
  - id: ops-secdev
    need: 방화벽·WAF 등 보안시스템의 정책과 관리자 접근을 승인·정기 검토한다
    severity: med
    effort: M
    fix: [정책 등록·변경·삭제를 승인으로 관리합니다., ANY 허용·만료 정책을 정기 점검합니다., 이벤트 모니터링 담당자를 정합니다.]
    evidence: [보안시스템 정책 검토 결과]
    map: { ismsp: [2.10.1], iso: [A.8.20, A.8.21] }
  - id: ops-cloud
    need: 클라우드 책임 범위를 정의하고 설정·권한을 보안 기준으로 통제·점검한다
    when: { fact: cloud, is: true }
    severity: high
    effort: M
    fix: [책임공유모델과 SLA·계약 보안 조건을 정리합니다., "CSPM(예. Prowler)으로 점검하고 `import prowler`로 결과를 연결합니다.", 루트 계정 MFA·관리자 최소화·공개 설정 차단을 적용합니다., 서비스 종료 시 데이터 반환·삭제 계획을 둡니다.]
    evidence: [클라우드 보안 기준, 클라우드 설정 점검 결과]
    map: { ismsp: [2.10.2], iso: [A.5.23, A.8.9] }
  - id: ops-public-server
    need: 공개서버를 내부망과 분리하고 취약점·게시 정보 절차를 관리한다
    when: { fact: publicServer, is: true }
    severity: high
    effort: M
    fix: [DMZ에 두고 DB와 분리합니다., 게시 전 개인정보 검토·승인을 둡니다., 웹 취약점을 정기 점검합니다.]
    evidence: [공개서버 점검 결과, 게시 승인 절차]
    map: { ismsp: [2.10.3], iso: [A.8.20, A.8.26] }
  - id: ops-ecommerce
    need: 전자거래·핀테크의 인증·암호화·무결성 대책과 연계 구간 보안을 적용한다
    when: { fact: ecommerce, is: true }
    severity: high
    effort: M
    fix: [결제·송금 흐름과 연계사를 문서화합니다., 거래 위변조 방지·이상거래 탐지를 적용합니다., 연계사 보안 점검과 계약을 확인합니다.]
    evidence: [전자거래 보안 점검 결과]
    map: { ismsp: [2.10.4], iso: [A.5.14, A.8.26] }
  - id: ops-transfer
    need: 다른 조직과 정보를 주고받을 때 전송 협약과 안전한 방식을 사용한다
    severity: med
    effort: S
    fix: [연계 목록과 협약을 관리합니다., 전용선·VPN·mTLS 등 방식을 정합니다.]
    evidence: [정보전송 협약, 연계 목록]
    map: { ismsp: [2.10.5], iso: [A.5.14] }
  - id: ops-endpoint
    need: 업무용 단말·모바일의 인증, 승인, 분실 대책과 공유 제한을 적용하고 점검한다
    legal: true
    severity: med
    effort: M
    fix: [MDM·화면잠금·원격삭제를 적용합니다., 업무용 모바일에 비밀번호를 강제합니다., 자료 유출 방지(DLP) 정책을 점검합니다.]
    evidence: [단말 관리 현황, MDM 설정]
    map: { pipa: [기준 제6조], ismsp: [2.10.6], iso: [A.8.1, A.8.12] }
  - id: ops-media
    need: 보조저장매체 사용을 통제하고 개인정보가 든 매체를 잠금 보관·점검한다
    legal: true
    severity: med
    effort: S
    fix: [USB 쓰기를 기본 차단합니다., 승인 매체 대장을 두고 실사합니다., 주요 구역 내 사용을 제한합니다.]
    evidence: [매체 관리대장, USB 차단 설정]
    map: { pipa: [기준 제10조], ismsp: [2.10.7], iso: [A.7.10] }
  - id: ops-patch
    need: OS·소프트웨어 보안 업데이트를 지체 없이 적용하고 예외를 보완·승인한다
    legal: true
    severity: high
    effort: M
    fix: [자산별 버전과 지원 종료(EOL)를 관리합니다., 긴급·중요 패치의 적용 기한을 정합니다., 적용 불가 시 보완통제를 승인합니다.]
    evidence: [패치 현황, 패치 예외 승인]
    map: { pipa: [기준 제9조], ismsp: [2.10.8], iso: [A.8.8, A.8.19] }
  - id: ops-malware
    need: 악성코드 방지 프로그램을 설치하고 자동 또는 일 1회 이상 업데이트하며 발견 시 조치한다
    legal: true
    severity: high
    effort: S
    fix: [서버·PC 설치율과 최신 버전을 중앙에서 확인합니다., 자동 업데이트·실시간 감시를 강제합니다., 탐지 시 격리·보고 절차를 둡니다.]
    evidence: [백신 설치·업데이트 현황, 탐지 조치 기록]
    map: { pipa: [기준 제9조], ismsp: [2.10.9], iso: [A.8.7] }
  - id: ops-print
    need: 개인정보 출력물과 외부 저장 복사물을 안전하게 관리한다
    legal: true
    severity: med
    effort: S
    fix: [출력·복사 용도와 승인 기준을 정합니다., 워터마크·출력 로그와 회수·파쇄 절차를 적용합니다.]
    evidence: [출력물 관리 기록]
    map: { pipa: [기준 제12조], ismsp: [2.4.7], iso: [A.7.10, A.8.12] }
  - id: cry-policy
    need: 법적 요구사항을 반영해 암호화 대상 정보, 알고리즘·키 길이(암호 강도), 사용 방법을 정한 암호 정책을 수립했다
    severity: high
    effort: S
    fix: [법령상 암호화 대상과 내부 중요정보를 목록으로 만듭니다., 저장·전송 구간별 허용 알고리즘과 키 길이를 정합니다., 정책을 승인받고 개발·운영 기준에 반영합니다.]
    evidence: [암호 정책, 암호화 대상 목록]
    map: { ismsp: [2.7.1], iso: [A.8.24] }
  - id: cry-key-recovery
    need: 암호키 분실·손상에 대비한 백업·복구 방안을 마련하고 시험한다
    severity: med
    effort: S
    fix: [복구가 필요한 암호키를 정합니다., 키 백업 위치와 접근권한을 정해 안전하게 보관합니다., 키 복구 절차를 주기적으로 시험합니다.]
    evidence: [암호키 백업·복구 절차, 복구 시험 결과]
    map: { ismsp: [2.7.2], iso: [A.8.24] }
  - id: log-policy
    need: 서버·응용·보안·네트워크 시스템별로 남길 로그 유형, 보존기간, 보존 방법을 정했다
    severity: med
    effort: S
    fix: [시스템 유형별로 접속기록·시스템로그·권한부여 내역 등 남길 로그를 정합니다., 로그별 보존기간과 저장 위치를 정합니다., 정한 기준을 로그 관리 지침에 넣습니다.]
    evidence: [로그 관리 지침, 시스템별 로그 현황]
    map: { ismsp: [2.9.4], iso: [A.8.15] }
  - id: log-protect
    need: 로그를 별도 저장소에 보관하고 접근권한 제한과 무결성 확인으로 위변조·도난·분실을 막는다
    legal: true
    severity: high
    effort: M
