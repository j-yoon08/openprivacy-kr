# 현장에서 쓰는 표현과, 검토자가 놓치면 안 되는 조문. 낱말 사전을 보지 않고 먼저 쓴 문장입니다.
- { text: 퇴사한 직원이 고객 명단을 들고 나갔다, must: [제34조, 제59조, 제29조] }
- { text: 상담원이 아는 사람의 주문 내역을 몰래 봤다, must: [제59조, 제29조] }
- { text: 단체 메일을 보내면서 참조에 고객 주소를 전부 넣었다, must: [제34조, 제29조] }
- { text: 구글에서 검색하니 우리 고객 파일이 그냥 열린다, must: [제34조, 제34조의2, 제29조] }
- { text: 노트북을 지하철에 두고 내렸는데 고객 엑셀이 들어 있다, must: [제34조, 제29조] }
- { text: 관리자 페이지 비번이 털린 것 같은데 실제로 빠져나갔는지는 모르겠다, must: [제34조, 제29조] }
- { text: 경찰이 공문 없이 회원 연락처를 달라고 한다, must: [제17조, 제18조] }
- { text: 모회사에 매출 분석용으로 고객 데이터를 보내려고 한다, must: [제17조, 제18조] }
- { text: 배송업체를 새로 계약해서 주소를 보내게 됐다, must: [제26조] }
- { text: 메일 발송을 외국 업체 솔루션으로 바꾼다, must: [제26조, 제28조의8] }
- { text: 세일즈포스와 노션에 고객 정보를 올려 쓰고 있다, must: [제26조, 제28조의8] }
- { text: 예전 회원들한테 신상품 문자를 돌리려고 한다, must: [제22조, 제15조] }
- { text: 고객이 자기 정보를 다 지워 달라고 한다, must: [제36조, 제37조, 제21조] }
- { text: 본인이 어떤 정보를 갖고 있는지 보여 달라고 전화했다, must: [제35조, 제38조] }
- { text: 사무실 복도에 감시용 카메라를 달려고 한다, must: [제25조] }
- { text: 배달 로봇이 길에서 영상을 찍는다, must: [제25조의2] }
- { text: 출퇴근 체크를 손가락 인식으로 바꾼다, must: [제23조, 제29조] }
- { text: 초등생 대상 학습 앱을 만든다, must: [제22조의2] }
- { text: 면접에서 떨어진 사람 이력서를 계속 갖고 있다, must: [제21조] }
- { text: 5년 지난 거래 기록을 그대로 두고 있다, must: [제21조] }
- { text: 이름을 지운 구매 데이터를 대학 연구팀에 주려고 한다, must: [제28조의2, 제28조의4] }
- { text: 챗GPT에 고객 문의를 붙여 넣어 답변을 만든다, must: [제26조, 제28조의8] }
- { text: 대출 신청을 시스템이 알아서 떨어뜨린다, must: [제37조의2] }
- { text: 다른 회사에 쇼핑몰 사업을 팔기로 했다, must: [제27조] }
- { text: 인터넷에 올라온 연락처를 긁어서 영업에 쓴다, must: [제15조, 제20조] }
- { text: 개인정보위에서 공문이 왔다, must: [제63조] }
- { text: 피해 고객이 돈을 물어내라고 한다, must: [제39조, 제39조의2] }
- { text: 가입할 때 민증 사진을 받는다, must: [제24조, 제24조의2] }
- { text: 아이디 하나를 팀원들이 같이 쓴다, must: [제29조, 기준 제5조] }
- { text: 마케팅 안 받겠다고 하면 가입을 못 하게 해 놨다, must: [제22조, 제16조] }
- { text: 사장이 보안에 돈을 안 쓰고 담당자도 없다, must: [제30조의3, 제31조] }
- { text: 홈페이지 개인정보 안내문이 3년 전 그대로다, must: [제30조] }
