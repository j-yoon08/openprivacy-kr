# 낱말 사전을 조정하지 않고 재현율만 재는 문장입니다. 이 문장에 맞춰 topics.yaml을 고치지 마세요.
- { text: 택배 송장 사진이 블로그에 올라가서 고객 주소가 다 보인다, must: [제34조, 제29조] }
- { text: 협력사 직원 계정으로 새벽에 수만 건이 내려받아졌다, must: [제34조, 제29조, 기준 제8조] }
- { text: 병원 예약 앱에서 다른 환자의 예약이 보인다는 신고가 들어왔다, must: [제34조, 제23조] }
- { text: 통신사에서 회원 통계를 사 가고 싶어 한다, must: [제17조, 제28조의2] }
- { text: 독일 지사 인사팀이 한국 인사 시스템을 들여다본다, must: [제28조의8] }
- { text: 헬스장 회원 얼굴로 문을 열어 준다, must: [제23조] }
- { text: 학원에서 초3 학생 전화번호를 받는다, must: [제22조의2] }
- { text: 폐업하면서 회원 DB를 어떻게 해야 할지 모르겠다, must: [제21조] }
- { text: 고객이 자기 통화 녹음을 들려 달라고 한다, must: [제35조] }
- { text: 이벤트 당첨자 전화번호를 협찬사가 요청했다, must: [제17조] }
- { text: 매장 천장에 카메라를 설치했고 소리도 녹음된다, must: [제25조] }
- { text: 개발자가 테스트하려고 운영 데이터를 자기 PC에 내려받았다, must: [제29조, 기준 제7조] }
- { text: 추첨 프로그램이 부정 응모자를 걸러 계정을 막는다, must: [제37조의2] }
- { text: 명예퇴직자의 급여 자료를 10년째 보관한다, must: [제21조] }
- { text: 경쟁사 홈페이지 후기 작성자의 아이디를 모아 분석한다, must: [제15조, 제20조] }
- { text: 시에서 재난문자용으로 주민 연락처를 요구했다, must: [제18조] }
- { text: 회원이 광고 문자를 멈춰 달라고 했는데 계속 나갔다, must: [제37조] }
- { text: 새 부사장을 개인정보 책임자로 바꾸려 한다, must: [제31조] }
- { text: 서비스를 인도 개발사에 맡기고 운영 DB 접근권을 줬다, must: [제26조, 제28조의8] }
- { text: 여권 사진을 카카오톡으로 받아 처리한다, must: [제24조, 제29조] }
